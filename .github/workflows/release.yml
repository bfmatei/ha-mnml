name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml
  build:
    runs-on: ubuntu-latest
    outputs:
      previous: ${{ steps.notes.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the manifest
        run: test "v$(jq -r .version custom_components/mnml/manifest.json)" = "$GITHUB_REF_NAME"
      - name: The tag is annotated, its message the release notes
        run: test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
      - name: The release notes, the tag message and the interface's changes since the previous tag
        id: notes
        run: |
          stable=()
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            stable+=(--exclude '*-*')
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${stable[@]}" "$GITHUB_REF_NAME^" 2> /dev/null) || previous=''
          {
            git tag --list --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME"
            if [[ -n "$previous" ]]; then
              node tools/notes.ts "$previous"
            fi
          } > notes.md
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - run: pnpm build
      - run: pnpm zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mnml
          path: mnml.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: notes
          path: notes.md
          if-no-files-found: error
  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mnml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: notes
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS: ${{ needs.build.outputs.previous }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if [[ -n "$PREVIOUS" ]]; then
            flags+=(--notes-start-tag "$PREVIOUS")
          fi
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" mnml.zip --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes "${flags[@]}"
          fi
