    <circle cx="820" cy="800" r="240" fill="#fbc89a" opacity="0.8"/>
    </g>
  </g>
  <rect x="64" y="351" width="896" height="322" rx="90" fill="url(#glass)" filter="url(#lift)"/>
  <rect x="65.5" y="352.5" width="893" height="319" rx="88.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <rect x="116" y="406" width="792" height="218" rx="42" fill="#ffffff" fill-opacity=".85"/>
  <rect x="116" y="403" width="792" height="218" rx="42" fill="#4a3f6b" fill-opacity=".10"/>
