<svg width="1024" height="1024" viewBox="0 0 1024 1024" role="img" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe8fa"/>
      <stop offset="1" stop-color="#e2edf8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".78"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".35"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="lift" x="-20%" y="-40%" width="140%" height="190%">
      <feDropShadow dx="0" dy="34" stdDeviation="38" flood-color="#10082a" flood-opacity=".22"/>
    </filter>
    <filter id="inset" x="-6%" y="-30%" width="112%" height="160%">
      <feComponentTransfer in="SourceAlpha"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur stdDeviation="9"/>
      <feOffset dy="10" result="shade"/>
      <feFlood flood-color="#10082a" flood-opacity=".30"/>
      <feComposite in2="shade" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#base)"/>
    <g filter="url(#soft)">
    <circle cx="260" cy="250" r="330" fill="#b6a6f5" opacity="0.95"/>
