glances:
  description: "The strip of the home's overall statuses, one line across the section: the weather, the alarm, the vacation toggle, and whatever needs you: failed checks, stopped guests, devices down or offline, low batteries, a lock or a car left open, a leak, smoke. What does not need you is not drawn."
  slots:
    weather:
      {
        kind: entity,
        discover: { domain: weather, scope: all },
        help: The weather entity of the home.,
        group: Status,
      }
    alarm: { kind: entity, discover: { domain: alarm_control_panel, scope: all }, group: Status }
    vacation:
      {
        kind: entity,
        label: Vacation,
        group: Status,
        help: The input boolean that marks the home as away.,
      }
    people:
      {
        kind: entities,
        discover: { domain: person, scope: all },
        help: The people whose presence tells whether the alarm and vacation fit the home.,
        group: Status,
      }
    energy:
      kind: object
      group: Status
      help: What the home uses, makes and stores; the item shows the power it uses and opens the energy pop-up.
      fields:
        usage: { kind: entity, required: true, label: Home usage }
        grid: { kind: entity, required: true }
        solar: { kind: entity }
        battery: { kind: entity }
        ev: { kind: entity, label: EV charger }
        grid_today: { kind: entity, label: Grid today }
        solar_today: { kind: entity, label: Solar today }
        export_today: { kind: entity, label: Export today }
    checks:
      shape: checks
      group: Problems
      help: The daily checks; the item counts the failed ones and the warnings together while there are any, and opens the checks pop-up.
    batteries:
      {
        kind: entities,
        discover: { domain: sensor, device_class: battery, scope: all },
        help: Counted while low.,
        group: Problems,
      }
    leaks:
      {
        kind: entities,
        discover: { domain: binary_sensor, device_class: moisture, scope: all },
        label: Leak sensors,
        group: Problems,
      }
    smoke:
      {
        kind: entities,
        discover: { domain: binary_sensor, device_class: smoke, scope: all },
        label: Smoke detectors,
        group: Problems,
      }
    notifications:
      {
        kind: entity,
        help: A sensor counting the notifications; shown while it is not 0.,
        group: Problems,
      }
    updates:
      {
        kind: entities,
        discover: { domain: update, scope: all },
        label: Updates and firmware,
        help: Counted while an update is pending.,
        group: Problems,
      }
    services:
      {
        kind: entities,
        label: Services,
        help: Binary sensors that are on while a service runs; counted while off.,
        group: Problems,
      }
    disks:
      {
        kind: entity,
        label: Failing disks,
        help: A sensor counting the failing disks; shown while it is not 0.,
        group: Problems,
      }
    backup:
      {
        kind: entity,
        label: Backup problem,
        help: A binary sensor that is on while the backups have a problem.,
        group: Problems,
      }
    guests:
      {
        kind: entities,
        discover:
          { domain: binary_sensor, platform: proxmoxve, translation_key: status, scope: all },
        help: "The Proxmox guests' running states; counted while off.",
        group: Problems,
      }
    network_devices:
      {
        kind: entities,
        discover: { domain: sensor, platform: unifi, translation_key: device_state, scope: all },
        label: Network devices,
        help: "The network devices' states; counted while not up.",
        group: Problems,
      }
    device_up:
      {
        kind: texts,
        default: [connected, upgrading, provisioning],
        label: Up states,
        group: Problems,
      }
    tailscale:
      {
        kind: entities,
        label: Essential Tailscale devices,
        help: 'The connection sensors of the Tailscale devices that must stay connected; counted while off.',
        group: Problems,
      }
    media_health:
      {
        kind: entity,
        discover: { domain: binary_sensor, platform: radarr, translation_key: health, scope: all },
        label: Media health,
        help: 'A binary sensor that is on while the media server reports a problem.',
        group: Problems,
      }
    locks:
      kind: objects
      group: Problems
      help: 'Each lock, and the key of the room whose pop-up deals with it; counted while unlocked, open or jammed.'
      fields:
        entity: { kind: entity, required: true }
        room: { kind: text, label: Room key }
      discover:
        device: { domain: lock }
        scope: all
        fields: { entity: { domain: lock }, room: area.id }
    cars:
      kind: objects
      group: Problems
      help: "Each car's key, lock state and arming state; counted while unlocked or unarmed, in the car template's words."
      fields:
        key: { kind: text, required: true }
        lock: { kind: entity }
        alarm: { kind: entity }
        unlocked: { kind: texts, default: [unlocked, selectivelocked] }
        disarmed: { kind: texts, default: [unarmed] }
    low: { kind: number, default: 20 }
    critical: { kind: number, default: 5 }
  card:
    type: custom:mnml-glances-card
    items:
      - id: weather
        if: weather
        entity: '[[weather]]'
        state: [{ id: temperature, attribute: temperature }]
        popup: '#weather'
      - id: alarm
        if: alarm
        entity: '[[alarm]]'
        name: Alarm
        bare: true
        toggle: true
        when: { not: [disarmed] }
        alert: { is: [triggered] }
        people: '[[people]]'
      - id: vacation
        if: vacation
        entity: '[[vacation]]'
        name: Vacation
        icon: mdi:palm-tree
        color: amber
        toggle: true
        quiet: true
        people: '[[people]]'
      - id: energy
        if: energy
        entity: '[[energy.usage]]'
        name: Energy
        icon: mdi:lightning-bolt
        popup: '#energy'
      - id: checks
        if: checks
        entities: ['[[checks.failed]]', '[[checks.warnings]]']
        name: Checks
        icon: mdi:clipboard-alert-outline
        sum: true
        critical: 1
        popup: '#checks'
      - id: notifications
        if: notifications
        entity: '[[notifications]]'
        name: Notifications
        icon: mdi:bell-badge-outline
        color: amber
        when: { not: ['0'] }
        show: { not: ['0'] }
        popup: '#proxmox-notifications'
      - id: disks
        if: disks
        entity: '[[disks]]'
        name: Failing disks
        icon: mdi:harddisk-remove
        color: red
        when: { not: ['0'] }
        show: { not: ['0'] }
        popup: '#proxmox'
      - id: backup
        if: backup
        entity: '[[backup]]'
        name: Backups
        icon: mdi:backup-restore
        color: orange
        show: { is: ['on'] }
        popup: '#proxmox'
      - id: guests
        if: guests
        entities: '[[guests]]'
        name: Stopped guests
        icon: mdi:server-network-off
        color: red
        is: ['off']
        popup: '#proxmox'
      - id: network-devices
        if: network_devices
        entities: '[[network_devices]]'
        name: Network devices down
        icon: mdi:access-point-network-off
        color: red
        not: '[[device_up]]'
        popup: '#network'
      - id: tailscale
        if: tailscale
        entities: '[[tailscale]]'
        name: Tailscale offline
        icon: mdi:lan-disconnect
        color: red
        is: ['off']
        popup: '#tailscale'
      - id: media-health
        if: media_health
        entities: ['[[media_health]]']
        name: Media health
        icon: mdi:heart-pulse
        color: red
        is: ['on']
        popup: '#media'
      - id: batteries
        if: batteries
        entities: '[[batteries]]'
        name: Low batteries
        icon: mdi:battery-alert-variant-outline
        below: '[[low]]'
        critical: '[[critical]]'
        popup: '#batteries'
      - id: services
        if: services
        entities: '[[services]]'
        name: Services down
        icon: mdi:server-off
        color: red
        is: ['off']
        popup: '#system'
      - id: updates
        if: updates
        entities: '[[updates]]'
        name: Updates
        icon: mdi:package-up
        color: amber
        is: ['on']
        popup: '#system'
      - id: each-locks
        each: locks
        as: lock
        if: lock.room
        entities: ['[[lock.entity]]']
        name: Unlocked
        icon: mdi:lock-open-variant-outline
        color: red
        is: [unlocked, open, jammed]
        popup: '#[[lock.room]]'
      - id: each-locks-2
        each: locks
        as: lock
        unless: lock.room
        entities: ['[[lock.entity]]']
        name: Unlocked
        icon: mdi:lock-open-variant-outline
        color: red
        is: [unlocked, open, jammed]
      - id: each-cars
        each: cars
        as: car
        if: [car.lock, car.alarm]
        entities: ['[[car.lock]]', '[[car.alarm]]']
        name: Car security
        icon: mdi:car-key
        color: red
        is: ['[[car.unlocked]]', '[[car.disarmed]]']
        popup: '#car-[[car.key]]'
      - id: leaks
        if: leaks
        entities: '[[leaks]]'
        name: Leaks
        icon: mdi:water-alert-outline
        color: red
        is: ['on']
      - id: smoke
        if: smoke
        entities: '[[smoke]]'
        name: Smoke
        icon: mdi:smoke-detector-variant-alert
        color: red
        is: ['on']
    grid_options: { columns: full }
  popups:
    - id: energy-popup
      if: energy
      template: energy-popup
      slots:
        usage: '[[energy.usage]]'
        grid: '[[energy.grid]]'
        solar: '[[energy.solar]]'
        battery: '[[energy.battery]]'
        ev: '[[energy.ev]]'
        grid_today: '[[energy.grid_today]]'
        solar_today: '[[energy.solar_today]]'
        export_today: '[[energy.export_today]]'
    - id: weather-popup
      if: weather
      template: weather-popup
      slots: { weather: '[[weather]]' }
    - id: checks-popup
      if: checks
      template: checks-popup
      slots: { checks: '[[checks]]' }
    - id: batteries-popup
      if: batteries
      template: batteries-popup
      slots: { batteries: '[[batteries]]', low: '[[low]]', critical: '[[critical]]' }
  example:
    weather: weather.home
    vacation: input_boolean.vacation
    batteries: [sensor.window_battery]

weather-popup:
  description: The weather now, its conditions and its forecast.
  slots:
    weather: { kind: entity, required: true }
  card:
    hash: '#weather'
    cards:
      - id: header
        type: custom:mnml-header-card
        name: Weather
        icon: mdi:weather-partly-cloudy
      - id: forecast
        type: custom:mnml-weather-card
        entity: '[[weather]]'
        title: Now and next
  example:
    weather: weather.home

checks-popup:
  description: 'The daily checks: what failed, the warnings, when they last ran, and the details.'
  slots:
    checks: { shape: checks, required: true }
  card:
    hash: '#checks'
    cards:
      - id: header
        type: custom:mnml-header-card
        name: Checks
        icon: mdi:clipboard-check-outline
        controls:
          - id: checks-actions
            if: checks.actions
            template: checks-actions
            slots: { actions: '[[checks.actions]]' }
        back: true
      - id: checks
        type: custom:mnml-list-card
        title: Daily checks
        icon: mdi:clipboard-check-outline
        rows:
          - id: checks-failed
            entity: '[[checks.failed]]'
            color: red
            when: { not: ['0'] }
          - id: checks-warnings
            if: checks.warnings
            entity: '[[checks.warnings]]'
            color: orange
            when: { not: ['0'] }
          - id: checks-last_run
            entity: '[[checks.last_run]]'
            relative: true
          - id: checks-overdue
            entity: '[[checks.overdue]]'
            flag: true
            color: orange
            show: { is: ['on'] }
      - id: failures
        type: custom:mnml-report-card
        entity: '[[checks.failed]]'
        title: Check details
        icon: mdi:clipboard-alert-outline
        colors: { warnings: orange }
  example:
    checks:
      failed: sensor.checks_failed
      last_run: sensor.checks_last_run
      overdue: binary_sensor.checks_overdue

batteries-popup:
  description: The batteries that are running low, lowest first, with their level as a bar.
  slots:
    batteries: { kind: entities }
    low: { kind: number, default: 20 }
    critical: { kind: number, default: 5 }
  card:
    hash: '#batteries'
    cards:
      - id: header
        type: custom:mnml-header-card
        name: Batteries
        icon: mdi:battery-alert-variant-outline
      - id: batteries
        type: custom:mnml-list-card
        lowest_first: true
        title: Running low
        icon: mdi:battery-low
        rows:
          - id: each-batteries
            each: batteries
            as: battery
            entity: '[[battery]]'
            label: device
            bar: true
            low: '[[low]]'
            low_only: true
            critical: '[[critical]]'
  example:
    batteries: [sensor.window_battery, sensor.door_battery]
