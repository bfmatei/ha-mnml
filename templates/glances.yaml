glances:
  description: "The strip of the home's overall statuses, one line across the section: the weather, the alarm, the vacation toggle, the power the home uses, each timer while it runs, and whatever needs you: failed checks, Home Assistant's messages, stopped guests, devices down or offline, low batteries, a leak, smoke. What does not need you is not drawn."
  title: Glances
  icon: mdi:view-dashboard-outline
  slots:
    weather:
      {
        kind: entity,
        discover: { domain: weather, scope: all },
        help: The weather entity of the home.,
        group: Status,
      }
    alarm: { kind: entity, discover: { domain: alarm_control_panel, scope: all }, group: Status }
    vacation:
      {
        kind: entity,
        label: Vacation,
        group: Status,
        help: The input boolean that marks the home as away.,
      }
    people:
      {
        kind: entities,
        discover: { domain: person, scope: all },
        help: The people whose presence tells whether the alarm and vacation fit the home.,
        group: Status,
      }
    energy:
      kind: object
      group: Status
      help: What the home uses, makes and stores, found in Home Assistant's energy settings; with a usage sensor, the item shows the power the home uses and opens the energy pop-up.
      fields:
        usage: { kind: entity, label: Home usage }
        grid: { kind: entity }
        solar: { kind: entity }
        battery: { kind: entity }
        battery_power: { kind: entity, label: Battery power }
        ev: { kind: entity, label: EV charger }
        grid_today: { kind: entity, label: Grid today }
        solar_today: { kind: entity, label: Solar today }
        export_today: { kind: entity, label: Export today }
      discover:
        fields:
          grid: energy.grid_power
          solar: energy.solar_power
          battery: energy.battery_charge
          battery_power: energy.battery_power
    meters:
      shape: meter
      kind: objects
      group: Status
      help: "The meters of the home's outlets and appliances; the energy pop-up lists them, highest power first, with their power now summed, and without a usage sensor, the item shows that sum."
      fields: { power: { required: true } }
      discover: energy.devices
    timers:
      kind: objects
      group: Status
      help: 'Each timer, and the key of the room whose pop-up shows it; drawn while it runs, counting down, among the statuses, since a running timer is not a problem.'
      fields:
        entity: { kind: entity, required: true }
        room: { kind: text, label: Room key }
      discover:
        device: { domain: timer }
        scope: all
        fields: { entity: { domain: timer }, room: area.id }
    checks:
      shape: checks
      group: Problems
      help: The daily checks; the item counts the failed ones and the warnings together while there are any, and opens the checks pop-up.
    batteries:
      {
        kind: entities,
        discover: { domain: sensor, device_class: battery, scope: all },
        help: Counted while low.,
        group: Problems,
      }
    battery_groups:
      shape: battery_group
      kind: objects
      label: Battery groups
      help: "The batteries' pop-up lists the low ones under a heading per group, such as a room or a person's devices, rather than in one list."
      group: Problems
    leaks:
      {
        kind: entities,
        discover: { domain: binary_sensor, device_class: moisture, scope: all },
        label: Leak sensors,
        help: 'Counted while wet, when no leak sensor is given by room.',
        group: Problems,
      }
    room_leaks:
      shape: room_leaks
      kind: objects
      label: Leak sensors by room
      help: "Each room's leak sensors and the room's key; an item for each room, counted while wet, opening the room's pop-up."
      group: Problems
      discover:
        per: area
        scope: all
        fields: { room: area.id, sensors: { domain: binary_sensor, device_class: moisture } }
    smoke:
      {
        kind: entities,
        discover: { domain: binary_sensor, device_class: smoke, scope: all },
        label: Smoke detectors,
        group: Problems,
      }
    notifications:
      {
        kind: entity,
        help: 'A sensor of the notifications, its alerts attribute counting the warnings and errors; shown while that is not 0.',
        group: Problems,
      }
    messages:
      {
        kind: flag,
        label: Home Assistant messages,
        help: "Home Assistant's notifications and, for an administrator, its repairs, counted while there are any; it opens their pop-up, which the Home Assistant template brings.",
        group: Problems,
      }
    updates:
      {
        kind: entities,
        discover: { domain: update, scope: all },
        label: Updates and firmware,
        help: Counted while an update is pending.,
        group: Problems,
      }
    services:
      {
        kind: entities,
        label: Services,
        help: Binary sensors that are on while a service runs; counted while off.,
        group: Problems,
      }
    disks:
      {
        kind: entity,
        label: Failing disks,
        help: A sensor counting the failing disks; shown while it is not 0.,
        group: Problems,
      }
    backup:
      {
        kind: entity,
        label: Backup problem,
        help: A binary sensor that is on while the backups have a problem.,
        group: Problems,
      }
    guests:
      {
        kind: entities,
        discover:
          { domain: binary_sensor, platform: proxmoxve, translation_key: status, scope: all },
        help: "The Proxmox guests' running states; counted while off.",
        group: Problems,
      }
    network_devices:
      {
        kind: entities,
        discover: { domain: sensor, platform: unifi, translation_key: device_state, scope: all },
        label: Network devices,
        help: "The network devices' states; counted while not up.",
        group: Problems,
      }
    device_up:
      {
        kind: texts,
        default: [connected, upgrading, provisioning],
        label: Up states,
        group: Problems,
      }
    tailscale:
      {
        kind: entities,
        label: Essential Tailscale devices,
        help: 'The connection sensors of the Tailscale devices that must stay connected; counted while off.',
        group: Problems,
      }
    media_health:
      {
        kind: entity,
        discover: { domain: binary_sensor, platform: radarr, translation_key: health, scope: all },
        label: Media health,
        help: 'A binary sensor that is on while the media server reports a problem.',
        group: Problems,
      }
    low: { kind: number, default: 20 }
    critical: { kind: number, default: 5 }
  card:
    type: custom:mnml-glances-card
    items:
      - id: weather
        if: weather
        entity: '[[weather]]'
        state: [{ id: temperature, attribute: temperature }]
        popup: '#weather'
      - id: alarm
        if: alarm
        entity: '[[alarm]]'
        name: '[[words.alarm]]'
        bare: true
        toggle: true
        confirm: { not: [disarmed] }
        when: { not: [disarmed] }
        alert: { is: [triggered] }
        people: '[[people]]'
      - id: vacation
        if: vacation
        entity: '[[vacation]]'
        name: '[[words.vacation]]'
        icon: mdi:airplane
        color: amber
        toggle: true
        confirm: { is: ['off'] }
        quiet: true
        people: '[[people]]'
      - id: energy
        if: energy.usage
        entity: '[[energy.usage]]'
        name: '[[words.energy]]'
        icon: mdi:lightning-bolt
        popup: '#energy'
      - id: meters
        if: meters
        unless: energy.usage
        entities: '[[meters.*.power]]'
        name: '[[words.energy]]'
        icon: mdi:lightning-bolt
        total: true
        popup: '#energy'
      - id: each-timers
        each: timers
        as: timer
        if: timer.room
        entity: '[[timer.entity]]'
        color: amber
        when: { is: [active] }
        show: { is: [active] }
        calm: true
        state: [{ id: remaining, remaining: true }]
        popup: '#[[timer.room]]'
      - id: each-timers-2
        each: timers
        as: timer
        unless: timer.room
        entity: '[[timer.entity]]'
        color: amber
        when: { is: [active] }
        show: { is: [active] }
        calm: true
        state: [{ id: remaining, remaining: true }]
      - id: problems
        template: glance-problems
        slots:
          checks: '[[checks]]'
          notifications: '[[notifications]]'
          messages: '[[messages]]'
          disks: '[[disks]]'
          backup: '[[backup]]'
          guests: '[[guests]]'
          network_devices: '[[network_devices]]'
          device_up: '[[device_up]]'
          tailscale: '[[tailscale]]'
          media_health: '[[media_health]]'
          batteries: '[[batteries]]'
          low: '[[low]]'
          critical: '[[critical]]'
          services: '[[services]]'
          updates: '[[updates]]'
          leaks: '[[leaks]]'
          room_leaks: '[[room_leaks]]'
          smoke: '[[smoke]]'
    grid_options: { columns: full }
  popups:
    - id: energy-popup
      if: [energy, meters]
      template: energy-popup
      slots:
        usage: '[[energy.usage]]'
        grid: '[[energy.grid]]'
        solar: '[[energy.solar]]'
        battery: '[[energy.battery]]'
        battery_power: '[[energy.battery_power]]'
        ev: '[[energy.ev]]'
        grid_today: '[[energy.grid_today]]'
        solar_today: '[[energy.solar_today]]'
        export_today: '[[energy.export_today]]'
        meters: '[[meters]]'
    - id: weather-popup
      if: weather
      template: weather-popup
      slots: { weather: '[[weather]]' }
    - id: checks-popup
      if: checks
      template: checks-popup
      slots: { checks: '[[checks]]' }
    - id: batteries-popup
      if: batteries
      template: batteries-popup
      slots:
        batteries: '[[batteries]]'
        groups: '[[battery_groups]]'
        low: '[[low]]'
        critical: '[[critical]]'
  example:
    weather: weather.home
    vacation: input_boolean.vacation
    batteries: [sensor.window_battery]

glance-problems:
  description: "The items of the strip that need you, each drawn only while it does: failed checks, notifications, Home Assistant's messages, failing disks, a backup problem, stopped guests, devices down or offline, the media server's health, low batteries, services down, updates, a leak, smoke."
  title: What needs you
  icon: mdi:alert-circle-outline
  slots:
    checks: { shape: checks }
    notifications: { kind: entity }
    messages: { kind: flag }
    disks: { kind: entity }
    backup: { kind: entity }
    guests: { kind: entities }
    network_devices: { kind: entities }
    device_up: { kind: texts, default: [connected, upgrading, provisioning] }
    tailscale: { kind: entities }
    media_health: { kind: entity }
    batteries: { kind: entities }
    low: { kind: number, default: 20 }
    critical: { kind: number, default: 5 }
    services: { kind: entities }
    updates: { kind: entities }
    leaks: { kind: entities }
    room_leaks: { shape: room_leaks, kind: objects }
    smoke: { kind: entities }
  card:
    - id: checks
      if: checks
      entities: ['[[checks.failed]]', '[[checks.warnings]]']
      name: '[[words.checks]]'
      icon: mdi:clipboard-alert-outline
      sum: true
      critical: 1
      popup: '#checks'
    - id: notifications
      if: notifications
      entity: '[[notifications]]'
      name: '[[words.notifications]]'
      icon: mdi:bell-badge-outline
      color: amber
      when: { attribute: alerts, not: ['0'] }
      show: { attribute: alerts, not: ['0'] }
      state: [{ id: alerts, attribute: alerts }]
      popup: '#proxmox-notifications'
    - id: messages
      if: messages
      messages: true
      name: '[[words.messages]]'
      icon: mdi:home-assistant
      color: amber
      popup: '#system-messages'
    - id: disks
      if: disks
      entity: '[[disks]]'
      name: '[[words.failing_disks]]'
      icon: mdi:harddisk-remove
      color: red
      when: { not: ['0'] }
      show: { not: ['0'] }
      popup: '#proxmox'
    - id: backup
      if: backup
      entity: '[[backup]]'
      name: '[[words.backups]]'
      icon: mdi:backup-restore
      color: orange
      show: { is: ['on'] }
      popup: '#proxmox'
    - id: guests
      if: guests
      entities: '[[guests]]'
      name: '[[words.stopped_guests]]'
      icon: mdi:server-network-off
      color: red
      is: ['off']
      popup: '#proxmox'
    - id: network-devices
      if: network_devices
      entities: '[[network_devices]]'
      name: '[[words.network_devices_down]]'
      icon: mdi:access-point-network-off
      color: red
      not: '[[device_up]]'
      popup: '#network'
    - id: tailscale
      if: tailscale
      entities: '[[tailscale]]'
      name: '[[words.tailscale_offline]]'
      icon: mdi:lan-disconnect
      color: red
      is: ['off']
      popup: '#tailscale'
    - id: media-health
      if: media_health
      entities: ['[[media_health]]']
      name: '[[words.media_health]]'
      icon: mdi:heart-pulse
      color: red
      is: ['on']
      popup: '#media'
    - id: batteries
      if: batteries
      entities: '[[batteries]]'
      name: '[[words.low_batteries]]'
      icon: mdi:battery-alert-variant-outline
      below: '[[low]]'
      critical: '[[critical]]'
      popup: '#batteries'
    - id: services
      if: services
      entities: '[[services]]'
      name: '[[words.services_down]]'
      icon: mdi:server-off
      color: red
      is: ['off']
      popup: '#system'
    - id: updates
      if: updates
      entities: '[[updates]]'
      name: '[[words.updates]]'
      icon: mdi:package-up
      color: amber
      is: ['on']
      popup: '#system'
    - id: each-room_leaks
      each: room_leaks
      as: room
      entities: '[[room.sensors]]'
      name: '[[words.leaks]]'
      icon: mdi:water-alert-outline
      color: red
      is: ['on']
      popup: '#[[room.room]]'
    - id: leaks
      if: leaks
      unless: room_leaks
      entities: '[[leaks]]'
      name: '[[words.leaks]]'
      icon: mdi:water-alert-outline
      color: red
      is: ['on']
    - id: smoke
      if: smoke
      entities: '[[smoke]]'
      name: '[[words.smoke]]'
      icon: mdi:smoke-detector-variant-alert
      color: red
      is: ['on']
  example:
    batteries: [sensor.window_battery]
    room_leaks: [{ room: laundry, sensors: [binary_sensor.laundry_leak] }]

weather-popup:
  description: The weather now, its conditions and its forecast.
  title: Weather pop-up
  icon: mdi:weather-partly-cloudy
  slots:
    weather: { kind: entity, required: true }
  card:
    hash: '#weather'
    cards:
      - id: header
        type: custom:mnml-header-card
        name: '[[words.weather]]'
        icon: mdi:weather-partly-cloudy
      - id: forecast
        type: custom:mnml-weather-card
        entity: '[[weather]]'
        title: '[[words.now_and_next]]'
  example:
    weather: weather.home

checks-popup:
  description: 'The daily checks: what failed, the warnings, when they last ran, and the details.'
  title: Checks pop-up
  icon: mdi:clipboard-check-outline
  slots:
    checks: { shape: checks, required: true }
  card:
    hash: '#checks'
    cards:
      - id: header
        type: custom:mnml-header-card
        entity: '[[checks.last_run]]'
        name: '[[words.checks]]'
        icon: mdi:clipboard-check-outline
        controls:
          - id: checks-controls
            template: checks-controls
            slots: { checks: '[[checks]]' }
        back: true
      - id: checks
        type: custom:mnml-list-card
        title: '[[words.daily_checks]]'
        icon: mdi:clipboard-check-outline
        rows:
          - id: checks-failed
            entity: '[[checks.failed]]'
            color: red
            when: { not: ['0'] }
          - id: checks-warnings
            if: checks.warnings
            entity: '[[checks.warnings]]'
            color: orange
            when: { not: ['0'] }
          - id: checks-last_run
            entity: '[[checks.last_run]]'
            relative: true
          - id: checks-overdue
            entity: '[[checks.overdue]]'
            flag: true
            color: orange
            show: { is: ['on'] }
      - id: failures
        type: custom:mnml-report-card
        entity: '[[checks.failed]]'
        title: '[[words.check_details]]'
        icon: mdi:clipboard-alert-outline
        colors: { warnings: orange }
  example:
    checks:
      failed: sensor.checks_failed
      last_run: sensor.checks_last_run
      overdue: binary_sensor.checks_overdue

batteries-popup:
  description: The batteries that are running low, lowest first, with their level as a bar, under a heading per group when the home gives groups.
  title: Batteries pop-up
  icon: mdi:battery-low
  slots:
    batteries: { kind: entities }
    groups: { shape: battery_group, kind: objects }
    low: { kind: number, default: 20 }
    critical: { kind: number, default: 5 }
  card:
    hash: '#batteries'
    cards:
      - id: header
        type: custom:mnml-header-card
        name: '[[words.batteries]]'
        icon: mdi:battery-alert-variant-outline
      - id: batteries
        unless: groups
        type: custom:mnml-list-card
        lowest_first: true
        title: '[[words.running_low]]'
        icon: mdi:battery-low
        rows:
          - id: each-batteries
            each: batteries
            as: battery
            entity: '[[battery]]'
            label: device
            bar: true
            low: '[[low]]'
            low_only: true
            critical: '[[critical]]'
      - id: each-groups
        each: groups
        as: group
        type: custom:mnml-list-card
        lowest_first: true
        title: '[[group.name]]'
        entity: '[[group.entity]]'
        icon: '[[group.icon]]'
        rows:
          - id: each-group-batteries
            each: group.batteries
            as: battery
            entity: '[[battery]]'
            label: device
            bar: true
            low: '[[low]]'
            low_only: true
            critical: '[[critical]]'
  example:
    batteries: [sensor.window_battery, sensor.door_battery]
    groups:
      - { name: Kitchen, icon: mdi:fridge, batteries: [sensor.window_battery] }
      - { entity: person.alex, icon: mdi:account, batteries: [sensor.door_battery] }
