media-server:
  description: A media server's tile, what is being watched, and its requests, downloads, health and update chips; it brings its pop-up. The parts are Plex, Jellyfin, Seerr, Radarr and Sonarr.
  title: Media server
  icon: mdi:filmstrip-box-multiple
  slots:
    streams:
      kind: entity
      required: true
      help: 'The number of streams playing.'
      discover: { domain: sensor, platform: jellyfin, translation_key: watching, scope: all }
    more_streams:
      kind: entities
      label: Other media servers
      help: 'The number of streams playing on other media servers, such as Jellyfin beside Plex.'
    update: { kind: entity }
    requests:
      shape: media_requests
      discover:
        fields:
          pending:
            { domain: sensor, platform: overseerr, translation_key: pending_requests, scope: all }
          processing:
            {
              domain: sensor,
              platform: overseerr,
              translation_key: processing_requests,
              scope: all,
            }
    movies:
      shape: movies
      discover:
        fields:
          queue: { domain: sensor, platform: radarr, translation_key: queue, scope: all }
          count: { domain: sensor, platform: radarr, translation_key: movies, scope: all }
          health: { domain: binary_sensor, platform: radarr, translation_key: health, scope: all }
          calendar: { domain: calendar, platform: radarr, scope: all }
    shows:
      shape: shows
      discover:
        fields:
          queue: { domain: sensor, platform: sonarr, translation_key: queue, scope: all }
          count: { domain: sensor, platform: sonarr, translation_key: series, scope: all }
          wanted: { domain: sensor, platform: sonarr, translation_key: wanted, scope: all }
          upcoming: { domain: sensor, platform: sonarr, translation_key: upcoming, scope: all }
          calendar: { domain: calendar, platform: sonarr, scope: all }
    none: { kind: texts, default: ['0', unknown, unavailable] }
    square: { shape: square }
  card:
    type: custom:mnml-tile-card
    name: '[[words.media]]'
    icon: mdi:play-box-multiple-outline
    popup: '#media'
    state:
      - { id: streams, entity: '[[streams]]', icon: true }
      - { id: each-more_streams, each: more_streams, as: server, entity: '[[server]]', icon: true }
    square: '[[square]]'
    chips:
      - id: requests
        if: requests
        type: status
        name: '[[words.requests]]'
        icon: mdi:account-clock-outline
        silent: true
        rules:
          [
            {
              id: requests-pending,
              if: none,
              entities: ['[[requests.pending]]'],
              color: amber,
              not: '[[none]]',
            },
          ]
      - id: movies-shows
        if: [movies, shows]
        type: status
        name: '[[words.downloads]]'
        icon: mdi:download
        silent: true
        rules:
          [
            {
              id: movies-queue,
              if: none,
              entities: ['[[movies.queue]]', '[[shows.queue]]'],
              label: device,
              color: amber,
              not: '[[none]]',
            },
          ]
      - id: movies-health
        if: movies.health
        type: status
        name: '[[words.health]]'
        icon: mdi:heart-pulse
        silent: true
        rules:
          [
            {
              id: movies-health,
              entities: ['[[movies.health]]'],
              label: device,
              color: red,
              is: ['on'],
            },
          ]
      - id: update
        if: update
        type: status
        name: '[[words.update]]'
        icon: mdi:package-up
        silent: true
        rules:
          [
            {
              id: update,
              if: update,
              entities: ['[[update]]'],
              label: device,
              color: amber,
              is: ['on'],
            },
          ]
    grid_options: { columns: 12 }
  popups:
    - id: media-popup
      template: media-popup
      slots:
        streams: '[[streams]]'
        more_streams: '[[more_streams]]'
        update: '[[update]]'
        requests: '[[requests]]'
        movies: '[[movies]]'
        shows: '[[shows]]'
        none: '[[none]]'
  example: &media
    streams: sensor.plex_watching
    movies: { queue: sensor.radarr_queue, count: sensor.radarr_movies }

media-popup:
  description: The media server's pop-up, what is being watched, its requests, downloads, upcoming releases, library and update.
  title: Media server pop-up
  icon: mdi:filmstrip-box-multiple
  slots:
    streams: { kind: entity, required: true }
    more_streams: { kind: entities }
    update: { kind: entity }
    requests: { shape: media_requests }
    movies: { shape: movies }
    shows: { shape: shows }
    none: { kind: texts, default: ['0', unknown, unavailable] }
  card:
    hash: '#media'
    cards:
      - id: header
        type: custom:mnml-header-card
        name: '[[words.media]]'
        icon: mdi:play-box-multiple-outline
      - id: watching
        type: custom:mnml-list-card
        title: '[[words.watching]]'
        icon: mdi:play-circle-outline
        rows:
          - { id: streams, entity: '[[streams]]', label: device }
          - {
              id: each-more_streams,
              each: more_streams,
              as: server,
              entity: '[[server]]',
              label: device,
            }
      - id: requests
        if: requests
        type: custom:mnml-list-card
        title: '[[words.requests]]'
        icon: mdi:account-clock-outline
        rows:
          - id: requests-pending
            if: none
            entity: '[[requests.pending]]'
            color: amber
            when: { not: '[[none]]' }
          - id: requests-pending-2
            unless: none
            entity: '[[requests.pending]]'
          - id: requests-processing
            entity: '[[requests.processing]]'
      - id: movies-shows
        if: [movies, shows]
        type: custom:mnml-list-card
        title: '[[words.downloads]]'
        icon: mdi:download
        rows:
          - id: movies
            if: movies
            entity: '[[movies.queue]]'
            label: device
            color: amber
            when: { not: '[[none]]' }
          - id: shows
            if: shows
            entity: '[[shows.queue]]'
            label: device
            color: amber
            when: { not: '[[none]]' }
          - id: shows-wanted
            if: shows.wanted
            entity: '[[shows.wanted]]'
          - id: movies-health
            if: movies.health
            entity: '[[movies.health]]'
            label: device
            flag: true
            color: red
            show: { is: ['on'] }
      - id: shows-calendar-movies-calendar
        if: [shows.calendar, movies.calendar]
        type: custom:mnml-agenda-card
        title: '[[words.upcoming]]'
        icon: mdi:calendar-clock
        sources:
          - id: shows-calendar
            if: shows.calendar
            entity: '[[shows.calendar]]'
            kind: episodes
          - id: movies-calendar
            if: movies.calendar
            entity: '[[movies.calendar]]'
            kind: movies
      - id: movies-shows-2
        if: [movies, shows]
        type: custom:mnml-list-card
        title: '[[words.library]]'
        icon: mdi:filmstrip-box-multiple
        rows:
          - id: movies
            if: movies
            entity: '[[movies.count]]'
            label: device
          - id: shows
            if: shows
            entity: '[[shows.count]]'
            label: device
          - id: shows-upcoming
            if: shows.upcoming
            entity: '[[shows.upcoming]]'
          - id: movies-space
            if: movies.space
            entity: '[[movies.space]]'
      - id: update
        if: update
        type: custom:mnml-list-card
        title: '[[words.update]]'
        icon: mdi:package-up
        rows:
          - id: pending-row
            template: pending-row
            slots: { entity: '[[update]]' }
  example: *media
