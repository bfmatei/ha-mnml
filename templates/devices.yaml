select-card:
  description: A dropdown over a select entity.
  title: Dropdown
  icon: mdi:form-dropdown
  slots:
    entity: { kind: entity, required: true }
  card:
    type: custom:mnml-select-card
    entity: '[[entity]]'
  example:
    entity: select.ac_power_saving

number-slider:
  description: A slider over a number entity.
  title: Number slider
  icon: mdi:tune-vertical
  slots:
    entity: { kind: entity, required: true }
  card:
    type: custom:mnml-slider-card
    entity: '[[entity]]'
    slider: value
  example:
    entity: number.ac_dehumidifier

switch-card:
  description: A switch as an item with its power toggle.
  title: Switch
  icon: mdi:toggle-switch-outline
  slots:
    entity: { kind: entity, required: true }
  card:
    type: custom:mnml-entity-card
    entity: '[[entity]]'
    color: amber
    controls:
      - id: power
        template: power
        slots: { entity: '[[entity]]' }
  example:
    entity: switch.kitchen_outlet

schedule-card:
  description: A schedule as an item, on or off and when it next changes, amber while on.
  title: Schedule
  icon: mdi:calendar-clock
  slots:
    entity: { kind: entity, required: true }
  card:
    type: custom:mnml-entity-card
    entity: '[[entity]]'
    color: amber
    state: [{ id: part }, { id: next-event, attribute: next_event, relative: true }]
  example:
    entity: schedule.kitchen_coffee

timer-card:
  description: 'A timer as an item, counting down while it runs, amber while it does: Start while it is not running, Pause while it is, Cancel and Finish while it is not idle, and its presets as a menu.'
  title: Timer
  icon: mdi:timer-outline
  slots:
    entity: { kind: entity, required: true }
  card:
    type: custom:mnml-entity-card
    entity: '[[entity]]'
    color: amber
    when: { is: [active] }
    state: [{ id: remaining, remaining: true }]
    controls:
      - id: start
        type: service
        entity: '[[entity]]'
        service: timer.start
        name: '[[words.start]]'
        icon: mdi:play
        primary: true
        show: { not: [active] }
      - id: pause
        type: service
        entity: '[[entity]]'
        service: timer.pause
        name: '[[words.pause]]'
        icon: mdi:pause
        primary: true
        show: { is: [active] }
      - id: cancel
        type: service
        entity: '[[entity]]'
        service: timer.cancel
        name: '[[words.cancel]]'
        icon: mdi:stop
        show: { not: [idle] }
      - id: finish
        type: service
        entity: '[[entity]]'
        service: timer.finish
        name: '[[words.finish]]'
        icon: mdi:check
        show: { not: [idle] }
      - id: presets
        type: select
        entity: '[[entity]]'
  example:
    entity: timer.kitchen_eggs

diffuser-card:
  description: A diffuser with its amount, an amount slider and its power toggle.
  title: Diffuser
  icon: mdi:spray
  slots:
    entity: { kind: entity, required: true }
    amount: { kind: entity }
  card:
    type: custom:mnml-entity-card
    entity: '[[entity]]'
    color: amber
    state: [{ id: part }, { id: amount, if: amount, entity: '[[amount]]' }]
    controls:
      - id: slider
        if: amount
        type: slider
        entity: '[[amount]]'
        slider: value
        name: '[[words.amount]]'
        icon: mdi:spray
      - id: power
        template: power
        slots: { entity: '[[entity]]' }
  example:
    entity: switch.office_diffuser
    amount: number.office_diffuser_amount

media-card:
  description: A media player, opening a pop-up when it has one.
  title: Media player
  icon: mdi:play-circle-outline
  slots:
    entity: { kind: entity, required: true, discover: { domain: media_player } }
    popup: { kind: text }
  card:
    type: custom:mnml-media-card
    entity: '[[entity]]'
    popup: '[[popup]]'
  example:
    entity: media_player.living_tv

cover-card:
  description: A cover, such as a blind, a shade or a garage door, with its position slider when it has one, and its open, stop and close buttons.
  title: Cover
  icon: mdi:blinds-horizontal
  slots:
    entity: { kind: entity, required: true, discover: { domain: cover } }
    garage: { kind: flag }
  card:
    type: custom:mnml-entity-card
    entity: '[[entity]]'
    color: amber
    controls:
      - id: position
        unless: garage
        type: slider
        entity: '[[entity]]'
        slider: position
        name: '[[words.position]]'
        icon: mdi:blinds-horizontal
      - id: open
        type: service
        entity: '[[entity]]'
        service: cover.open_cover
        name: '[[words.open]]'
        icon: mdi:arrow-up
        show: { not: [open, opening] }
      - id: stop
        unless: garage
        type: service
        entity: '[[entity]]'
        service: cover.stop_cover
        name: '[[words.stop]]'
        icon: mdi:stop
        show: { is: [opening, closing] }
      - id: close
        type: service
        entity: '[[entity]]'
        service: cover.close_cover
        name: '[[words.close]]'
        icon: mdi:arrow-down
        show: { not: [closed, closing] }
  example:
    entity: cover.living_blinds

fan-card:
  description: A fan or air purifier with its air quality, its speed slider and its power toggle.
  title: Fan
  icon: mdi:fan
  slots:
    entity: { kind: entity, required: true, discover: { domain: fan } }
    quality: { kind: entity }
  card:
    type: custom:mnml-entity-card
    entity: '[[entity]]'
    color: blue
    state: [{ id: part }, { id: quality, if: quality, entity: '[[quality]]' }]
    controls:
      - id: speed
        type: slider
        entity: '[[entity]]'
        slider: percentage
        name: '[[words.speed]]'
        icon: mdi:fan
      - id: power
        template: power
        slots: { entity: '[[entity]]', color: blue }
  example:
    entity: fan.bedroom_purifier

humidifier-card:
  description: A humidifier or dehumidifier with its target humidity slider and its power toggle.
  title: Humidifier
  icon: mdi:air-humidifier
  slots:
    entity: { kind: entity, required: true, discover: { domain: humidifier } }
  card:
    type: custom:mnml-entity-card
    entity: '[[entity]]'
    color: blue
    controls:
      - id: target
        type: slider
        entity: '[[entity]]'
        slider: humidity
        name: '[[words.target]]'
        icon: mdi:water-percent
      - id: power
        template: power
        slots: { entity: '[[entity]]', color: blue }
  example:
    entity: humidifier.bedroom

camera-card:
  description: A camera's live picture.
  title: Camera
  icon: mdi:cctv
  slots:
    entity: { kind: entity, required: true, discover: { domain: camera } }
  card:
    type: picture-entity
    entity: '[[entity]]'
    show_name: false
    show_state: false
    camera_view: live
  example:
    entity: camera.porch

camera-activity:
  description: 'A folding list of what the cameras of a room detect: motion, a person, a ring at the door. Orange while detected.'
  title: Camera activity
  icon: mdi:motion-sensor
  slots:
    cameras: { shape: camera, kind: objects }
  card:
    type: custom:mnml-list-card
    title: '[[words.activity]]'
    icon: mdi:motion-sensor
    rows:
      - id: each-doorbell
        each: cameras
        as: camera
        if: camera.doorbell
        entity: '[[camera.doorbell]]'
        label: device
        color: orange
      - id: each-person
        each: cameras
        as: camera
        if: camera.person
        entity: '[[camera.person]]'
        label: device
        color: orange
      - id: each-motion
        each: cameras
        as: camera
        if: camera.motion
        entity: '[[camera.motion]]'
        label: device
        color: orange
  example:
    cameras:
      - {
          entity: camera.porch,
          motion: binary_sensor.porch_motion,
          doorbell: binary_sensor.porch_doorbell,
        }

appliance-card:
  description: A washer, dryer or dishwasher with its cycle state, the time left and its power draw; blue while a cycle runs.
  title: Appliance
  icon: mdi:washing-machine
  slots:
    entity: { kind: entity, required: true }
    remaining: { kind: entity }
    power: { kind: entity }
  card:
    type: custom:mnml-entity-card
    entity: '[[entity]]'
    color: blue
    when: { is: [run, running, washing, drying, rinsing, spinning, in_use, 'on'] }
    state:
      - { id: part }
      - { id: remaining, if: remaining, entity: '[[remaining]]' }
      - { id: power, if: power, entity: '[[power]]' }
  example:
    entity: sensor.laundry_washer
    remaining: sensor.laundry_washer_time_left

pet-card:
  description: A pet's feeder with when it last ate, the food and litter levels, and a feed button.
  title: Pet feeder
  icon: mdi:paw
  slots:
    feed: { kind: entity, required: true }
    fed: { kind: entity, required: true }
    food: { kind: entity }
    litter: { kind: entity }
  card:
    type: custom:mnml-entity-card
    entity: '[[fed]]'
    color: amber
    state:
      - { id: part }
      - { id: food, if: food, entity: '[[food]]' }
      - { id: litter, if: litter, entity: '[[litter]]' }
    controls:
      - id: feed
        type: service
        entity: '[[feed]]'
        service: button.press
        name: '[[words.feed]]'
        icon: mdi:food-drumstick
  example:
    feed: button.kitchen_feeder_feed
    fed: sensor.kitchen_feeder_last_fed

plants:
  description: A folding list of the plants' soil moisture, driest first, orange under 30 % and red under 15 %.
  title: Plants
  icon: mdi:flower
  slots:
    plants: { shape: plant, kind: objects }
    low: { kind: number, default: 30 }
    critical: { kind: number, default: 15 }
  card:
    - id: plants
      if: plants
      type: custom:mnml-list-card
      lowest_first: true
      fold: true
      summary: lowest
      title: '[[words.plants]]'
      icon: mdi:flower
      rows:
        - id: each-plants
          each: plants
          as: plant
          entity: '[[plant.moisture]]'
          label: device
          bar: true
          low: '[[low]]'
          critical: '[[critical]]'
  example:
    plants:
      - { moisture: sensor.living_ficus_moisture }
