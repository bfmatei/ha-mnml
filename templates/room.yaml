room:
  description: A room's tile, its temperature and humidity, its window, door, lock and climate chips, its lights, and its leak and low battery chips; it brings the room's pop-ups.
  slots:
    key:
      {
        label: 'Short name',
        kind: text,
        required: true,
        discover: area.id,
        help: "Names the room's pop-ups.",
        group: Basics,
      }
    name:
      {
        kind: text,
        required: true,
        discover: area.name,
        group: Basics,
        help: "The room's name on its tile.",
      }
    icon: { kind: icon, default: mdi:texture-box, discover: area.icon, group: Basics }
    temperature:
      {
        kind: entity,
        discover: [area.temperature, { domain: sensor, device_class: temperature }],
        group: Sensors,
      }
    humidity:
      {
        kind: entity,
        discover: [area.humidity, { domain: sensor, device_class: humidity }],
        group: Sensors,
      }
    window:
      { kind: entity, discover: { domain: binary_sensor, device_class: window }, group: Sensors }
    door: { kind: entity, discover: { domain: binary_sensor, device_class: door }, group: Sensors }
    lock: { kind: entity, discover: { domain: lock }, group: Sensors }
    lights:
      shape: lights
      help: "The room's lights: their group, and the members it controls."
      group: Lights
      fields: { members: { fields: { entity: { required: true } } } }
      discover:
        fields:
          group: [{ domain: light, platform: group }, { domain: light }]
          members: { per: device, where: { domain: light }, fields: { entity: { domain: light } } }
          scenes: { domain: scene }
    heating:
      shape: heating
      group: Climate
      fields: { thermostats: { fields: { valve: { required: true } } } }
      discover:
        device: { domain: climate, exclude: { attribute: { hvac_modes: cool } } }
        fields:
          entity: { domain: climate, exclude: { attribute: { hvac_modes: cool } } }
          thermostats:
            - per: device
              scope: area
              where: { domain: sensor, translation_key: valve_position }
              fields:
                valve: { domain: sensor, translation_key: valve_position }
                battery: { domain: sensor, device_class: battery }
            - per: device
              scope: area
              where: { domain: sensor, name: valve position }
              fields:
                valve: { domain: sensor, name: valve position }
                battery: { domain: sensor, device_class: battery }
    ac:
      shape: ac
      label: Air conditioning
      group: Climate
      fields: { energy: { fields: { power: { required: true } } } }
      discover:
        device: { domain: climate, attribute: { hvac_modes: cool } }
        fields:
          entity: { domain: climate, attribute: { hvac_modes: cool } }
          power_saving:
            - { domain: select, translation_key: power_saving_mode }
            - { domain: select, name: power saving }
          dehumidifier:
            - { domain: number, translation_key: dehumidifier_level }
            - { domain: number, name: dehumidifier }
          energy:
            fields:
              power: { domain: sensor, device_class: power }
              today: { domain: sensor, device_class: energy, platform: utility_meter }
              total: { domain: sensor, device_class: energy, exclude: { platform: utility_meter } }
    vacuum:
      shape: vacuum_popup
      group: Devices
      discover:
        device: { domain: vacuum }
        fields:
          entity: { domain: vacuum }
          status:
            - { domain: sensor, translation_key: status }
            - { domain: sensor, name: status }
          error:
            - { domain: sensor, translation_key: vacuum_error }
            - { domain: sensor, name: error, exclude: { name: dock } }
          battery: { domain: sensor, device_class: battery }
          current_room:
            - { domain: sensor, translation_key: current_room }
            - { domain: sensor, name: current room }
          progress:
            - { domain: sensor, translation_key: clean_percent }
            - { domain: sensor, name: cleaning progress }
          area:
            - { domain: sensor, translation_key: cleaning_area }
            - { domain: sensor, name: cleaning area, exclude: { name: total } }
          time:
            - { domain: sensor, translation_key: cleaning_time }
            - { domain: sensor, name: cleaning time, exclude: { name: total } }
          last_clean:
            - { domain: sensor, translation_key: last_clean_end }
            - { domain: sensor, name: last clean end }
          mop_attached:
            - { domain: binary_sensor, translation_key: mop_attached }
            - { domain: binary_sensor, name: mop attached }
          water_box_attached:
            - { domain: binary_sensor, translation_key: water_box_attached }
            - { domain: binary_sensor, name: water box attached }
          totals:
            fields:
              count:
                - { domain: sensor, translation_key: total_cleaning_count }
                - { domain: sensor, name: total cleaning count }
              area:
                - { domain: sensor, translation_key: total_cleaning_area }
                - { domain: sensor, name: total cleaning area }
              time:
                - { domain: sensor, translation_key: total_cleaning_time }
                - { domain: sensor, name: total cleaning time }
          map: { domain: image }
          routines: { domain: button, entity_category: none }
          settings:
            { domain: select, entity_category: config, exclude: { translation_key: selected_map } }
          warnings: { domain: binary_sensor, device_class: problem }
          dock:
            device:
              - { domain: sensor, translation_key: dock_error }
              - { model: dock }
              - { domain: sensor, name: dock error }
            scope: area
            fields:
              error:
                - { domain: sensor, translation_key: dock_error }
                - { domain: sensor, name: error }
              dust_emptying:
                - { domain: switch, translation_key: dust_emptying }
                - { domain: switch, name: dust emptying }
              mop_drying:
                - { domain: switch, translation_key: mop_drying }
                - { domain: switch, name: mop drying }
              mop_drying_time_left:
                - { domain: sensor, translation_key: mop_drying_remaining_time }
                - { domain: sensor, name: mop drying }
              mop_washing:
                - { domain: switch, translation_key: mop_washing }
                - { domain: switch, name: mop washing }
              warnings: { domain: binary_sensor, device_class: problem }
    printer3d:
      shape: printer3d_popup
      label: 3D printer
      group: Devices
      discover:
        device: { platform: prusalink }
        fields:
          entity:
            - { domain: sensor, translation_key: printer_state }
            - { domain: sensor, device_class: enum }
          progress:
            - { domain: sensor, translation_key: progress }
            - { domain: sensor, name: progress }
          filename:
            - { domain: sensor, translation_key: filename }
            - { domain: sensor, name: filename }
          material:
            - { domain: sensor, translation_key: material }
            - { domain: sensor, name: material }
          speed:
            - { domain: sensor, translation_key: print_speed }
            - { domain: sensor, name: print speed }
          start:
            - { domain: sensor, translation_key: print_start }
            - { domain: sensor, name: print start }
          finish:
            - { domain: sensor, translation_key: print_finish }
            - { domain: sensor, name: print finish }
          nozzle:
            fields:
              temperature:
                - { domain: sensor, translation_key: nozzle_temperature }
                - { domain: sensor, name: nozzle temperature, exclude: { name: target } }
              target:
                - { domain: sensor, translation_key: nozzle_target_temperature }
                - { domain: sensor, name: nozzle target temperature }
          bed:
            fields:
              temperature:
                - { domain: sensor, translation_key: heatbed_temperature }
                - { domain: sensor, name: heatbed temperature, exclude: { name: target } }
              target:
                - { domain: sensor, translation_key: heatbed_target_temperature }
                - { domain: sensor, name: heatbed target temperature }
          camera: { domain: camera }
          actions:
            fields:
              pause:
                - { domain: button, translation_key: pause_job }
                - { domain: button, name: pause }
              resume:
                - { domain: button, translation_key: resume_job }
                - { domain: button, name: resume }
              continue:
                - { domain: button, translation_key: continue_job }
                - { domain: button, name: continue }
              cancel:
                - { domain: button, translation_key: cancel_job }
                - { domain: button, name: cancel }
    cameras:
      shape: camera
      kind: objects
      group: Security
      discover: { per: device, where: { domain: camera }, fields: { entity: { domain: camera } } }
    covers:
      shape: cover
      kind: objects
      group: Covers
      discover: { per: device, where: { domain: cover }, fields: { entity: { domain: cover } } }
    fans:
      shape: fan
      kind: objects
      group: Air
      discover: { per: device, where: { domain: fan }, fields: { entity: { domain: fan } } }
    humidifiers:
      shape: humidifier
      kind: objects
      group: Air
      discover:
        { per: device, where: { domain: humidifier }, fields: { entity: { domain: humidifier } } }
    appliances:
      shape: appliance
      kind: objects
      group: Devices
      discover:
        device:
          - { domain: sensor, platform: smartthings, translation_key: washer_machine_state }
          - { domain: sensor, platform: smartthings, translation_key: dryer_machine_state }
          - { domain: sensor, platform: smartthings, translation_key: dishwasher_machine_state }
          - {
              domain: sensor,
              platform: home_connect,
              translation_key: operation_state,
              name: washer,
            }
          - {
              domain: sensor,
              platform: home_connect,
              translation_key: operation_state,
              name: dryer,
            }
        fields:
          entity:
            - { domain: sensor, translation_key: washer_machine_state }
            - { domain: sensor, translation_key: dryer_machine_state }
            - { domain: sensor, translation_key: dishwasher_machine_state }
            - { domain: sensor, translation_key: operation_state }
          remaining:
            - { domain: sensor, translation_key: completion_time }
            - { domain: sensor, translation_key: program_finish_time }
          power: { domain: sensor, device_class: power }
    pets: { shape: pet, kind: objects, group: Devices }
    plants: { shape: plant, kind: objects, group: Devices }
    media:
      shape: player
      kind: objects
      label: Players
      group: Media
      discover:
        per: device
        where: { domain: media_player }
        fields:
          entity: { domain: media_player }
          key:
            - { domain: media_player, device_class: speaker }
            - { domain: media_player, platform: sonos }
    speakers:
      shape: speaker
      kind: objects
      group: Media
      discover:
        device:
          - { domain: media_player, device_class: speaker }
          - { domain: media_player, platform: sonos }
        fields:
          key:
            - { domain: media_player, device_class: speaker }
            - { domain: media_player, platform: sonos }
          entity:
            - { domain: media_player, device_class: speaker }
            - { domain: media_player, platform: sonos }
          bass:
            - { domain: number, translation_key: bass }
            - { domain: number, name: bass }
          treble:
            - { domain: number, translation_key: treble }
            - { domain: number, name: treble }
          balance:
            - { domain: number, translation_key: balance }
            - { domain: number, name: balance }
          loudness:
            - { domain: switch, translation_key: loudness }
            - { domain: switch, name: loudness }
          tv:
            fields:
              input_format:
                - { domain: sensor, translation_key: audio_input_format }
                - { domain: sensor, name: audio input format }
              night_sound:
                - { domain: switch, translation_key: night_mode }
                - { domain: switch, name: night sound }
              speech_enhancement:
                - { domain: switch, translation_key: dialog_level }
                - { domain: switch, name: speech enhancement }
              audio_delay:
                - { domain: number, translation_key: audio_delay }
                - { domain: number, name: audio delay }
          subwoofer:
            fields:
              enabled:
                - { domain: switch, translation_key: sub_enabled }
                - { domain: switch, name: subwoofer enabled }
              gain:
                - { domain: number, translation_key: sub_gain }
                - { domain: number, name: sub gain }
          surround:
            fields:
              enabled:
                - { domain: switch, translation_key: surround_enabled }
                - { domain: switch, name: surround enabled }
              level:
                - { domain: number, translation_key: surround_level }
                - { domain: number, name: surround level, exclude: { name: music } }
              music_level:
                - { domain: number, translation_key: music_surround_level }
                - { domain: number, name: music surround level }
              music_full_volume:
                - { domain: switch, translation_key: surround_mode }
                - { domain: switch, name: surround music full volume }
    outlets:
      shape: outlet
      kind: objects
      group: Devices
      discover:
        per: device
        where: { domain: switch, device_class: outlet }
        fields:
          entity: { domain: switch, device_class: outlet }
          energy:
            fields:
              power: { domain: sensor, device_class: power }
              today: { domain: sensor, device_class: energy, platform: utility_meter }
              total: { domain: sensor, device_class: energy, exclude: { platform: utility_meter } }
    diffuser: { shape: diffuser, group: Devices }
    batteries:
      {
        kind: entities,
        discover: { domain: sensor, device_class: battery },
        help: Low ones show as a chip on the tile.,
        group: Problems,
      }
    leaks:
      {
        kind: entities,
        discover: { domain: binary_sensor, device_class: moisture },
        label: Leak sensors,
        group: Problems,
      }
    low: { kind: number, default: 20, label: Low battery, group: Problems }
    critical: { kind: number, default: 5, label: Critical battery, group: Problems }
  retired: [meters, heating.batteries]
  card:
    type: custom:mnml-tile-card
    name: '[[name]]'
    icon: '[[icon]]'
    popup: '#[[key]]'
    state:
      - id: temperature
        if: temperature
        entity: '[[temperature]]'
        icon: true
      - id: humidity
        if: humidity
        entity: '[[humidity]]'
        icon: true
    chips?:
      - id: window
        if: window
        type: indicator
        entity: '[[window]]'
        color: orange
        show: { not: ['off'] }
      - id: door
        if: door
        type: indicator
        entity: '[[door]]'
        color: orange
        show: { not: ['off'] }
      - id: lock
        if: lock
        type: toggle
        entity: '[[lock]]'
        color: red
        when: { is: [unlocked, open, jammed] }
      - id: each-garage
        each: covers
        as: cover
        if: cover.garage
        type: toggle
        entity: '[[cover.entity]]'
        color: orange
        when: { is: [open, opening, closing] }
        show: { is: [open, opening, closing] }
      - id: each-doorbell
        each: cameras
        as: camera
        if: camera.doorbell
        type: indicator
        entity: '[[camera.doorbell]]'
        color: orange
        show: { is: ['on'] }
      - id: each-person
        each: cameras
        as: camera
        if: camera.person
        type: indicator
        entity: '[[camera.person]]'
        color: orange
        show: { is: ['on'] }
      - id: ac
        if: ac
        template: nav-chip
        slots:
          { entity: '[[ac.entity]]', popup: '#[[key]]-ac', color: blue, when: { not: ['off'] } }
      - id: heating
        if: heating
        template: nav-chip
        slots:
          {
            entity: '[[heating.entity]]',
            popup: '#[[key]]-heating',
            color: orange,
            when: { not: ['off'] },
          }
      - id: leaks
        if: leaks
        type: status
        name: Leak
        icon: mdi:water-alert-outline
        silent: true
        rules:
          - { id: leaks, entities: '[[leaks]]', is: ['on'], color: red, label: device }
      - id: batteries
        if: batteries
        type: status
        name: Batteries
        icon: mdi:battery-alert-variant-outline
        silent: true
        rules:
          - {
              id: critical,
              if: critical,
              entities: '[[batteries]]',
              below: '[[critical]]',
              color: red,
              label: device,
            }
          - {
              id: low,
              if: low,
              entities: '[[batteries]]',
              below: '[[low]]',
              color: orange,
              label: device,
            }
    item:
      if: lights.group
      template: light-item
      slots:
        entity: '[[lights.group]]'
        popup: '#[[key]]-lights'
        scenes: '[[lights.scenes]]'
        active_scene: '[[lights.active_scene]]'
        color: '[[lights.color]]'
    grid_options: { columns: 12 }
  popups:
    - id: room-popup
      template: room-popup
      slots:
        key: '[[key]]'
        name: '[[name]]'
        icon: '[[icon]]'
        temperature: '[[temperature]]'
        humidity: '[[humidity]]'
        window: '[[window]]'
        door: '[[door]]'
        lock: '[[lock]]'
        lights: '[[lights]]'
        heating: '[[heating]]'
        ac: '[[ac]]'
        vacuum: '[[vacuum]]'
        printer3d: '[[printer3d]]'
        cameras: '[[cameras]]'
        covers: '[[covers]]'
        fans: '[[fans]]'
        humidifiers: '[[humidifiers]]'
        appliances: '[[appliances]]'
        pets: '[[pets]]'
        plants: '[[plants]]'
        media: '[[media]]'
        outlets: '[[outlets]]'
        diffuser: '[[diffuser]]'
        batteries: '[[batteries]]'
        low: '[[low]]'
        critical: '[[critical]]'
    - id: lights-popup
      if: lights.group
      template: lights-popup
      slots:
        key: '[[key]]'
        name: '[[name]]'
        group: '[[lights.group]]'
        color: '[[lights.color]]'
        members: '[[lights.members]]'
        scenes: '[[lights.scenes]]'
        active_scene: '[[lights.active_scene]]'
    - id: heating
      if: heating
      template: heating-popup
      slots:
        key: '[[key]]'
        name: '[[name]]'
        entity: '[[heating.entity]]'
        preset: '[[heating.preset]]'
        thermostats: '[[heating.thermostats]]'
        low: '[[low]]'
        critical: '[[critical]]'
    - id: ac
      if: ac
      template: ac-popup
      slots:
        key: '[[key]]'
        name: '[[name]]'
        entity: '[[ac.entity]]'
        fan: '[[ac.fan]]'
        swing: '[[ac.swing]]'
        horizontal_swing: '[[ac.horizontal_swing]]'
        power_saving: '[[ac.power_saving]]'
        dehumidifier: '[[ac.dehumidifier]]'
        energy: '[[ac.energy]]'
    - id: vacuum
      if: vacuum
      template: vacuum-popup
      slots: { key: '[[key]]', name: '[[name]]', vacuum: '[[vacuum]]' }
    - id: printer3d
      if: printer3d
      template: 3d-printer-popup
      slots: { key: '[[key]]', name: '[[name]]', printer3d: '[[printer3d]]' }
    - id: each-speakers
      each: speakers
      as: speaker
      template: speaker-popup
      slots: { key: '[[key]]', name: '[[name]]', speaker: '[[speaker]]' }
  example:
    key: kitchen
    name: Kitchen
    icon: mdi:fridge
    temperature: sensor.kitchen_temperature
    humidity: sensor.kitchen_humidity
    lights: { group: light.kitchen_lights }

room-media-card:
  description: A room's media player, opening its speaker pop-up when it is a speaker.
  slots:
    key: { kind: text, required: true }
    member: { shape: player, required: true }
  card:
    - id: member-key
      if: member.key
      template: media-card
      slots: { entity: '[[member.entity]]', popup: '#[[key]]-[[member.key]]' }
    - id: not-member-key
      unless: member.key
      template: media-card
      slots: { entity: '[[member.entity]]' }
  example:
    key: living
    member: { entity: media_player.living_tv }

room-popup:
  description: A room's pop-up, its lights, climate, media and other devices, its batteries and its energy.
  slots:
    key: { kind: text, required: true }
    name: { kind: text, required: true }
    icon: { kind: icon, default: mdi:texture-box }
    temperature: { kind: entity }
    humidity: { kind: entity }
    window: { kind: entity }
    door: { kind: entity }
    lock: { kind: entity }
    lights: { shape: lights }
    heating: { shape: heating }
    ac: { shape: ac }
    vacuum: { shape: vacuum }
    printer3d: { shape: printer3d }
    cameras: { shape: camera, kind: objects }
    covers: { shape: cover, kind: objects }
    fans: { shape: fan, kind: objects }
    humidifiers: { shape: humidifier, kind: objects }
    appliances: { shape: appliance, kind: objects }
    pets: { shape: pet, kind: objects }
    plants: { shape: plant, kind: objects }
    media: { shape: player, kind: objects }
    outlets: { shape: outlet, kind: objects }
    diffuser: { shape: diffuser }
    batteries: { kind: entities }
    low: { kind: number, default: 20 }
    critical: { kind: number, default: 5 }
  retired: [meters, heating.batteries]
  card:
    hash: '#[[key]]'
    cards:
      - id: header
        type: custom:mnml-header-card
        name: '[[name]]'
        icon: '[[icon]]'
        state:
          - id: temperature
            if: temperature
            entity: '[[temperature]]'
            icon: true
          - id: humidity
            if: humidity
            entity: '[[humidity]]'
            icon: true
        controls?:
          - id: lock
            if: lock
            type: toggle
            entity: '[[lock]]'
            color: red
            when: { is: [unlocked, open, jammed] }
          - id: window
            if: window
            type: indicator
            entity: '[[window]]'
            color: orange
          - id: door
            if: door
            type: indicator
            entity: '[[door]]'
            color: orange
      - id: heading
        if: lights.group
        type: custom:mnml-heading-card
        title: Lights
        icon: mdi:lightbulb-group
      - id: light-card
        if: lights.group
        template: light-card
        slots:
          entity: '[[lights.group]]'
          popup: '#[[key]]-lights'
          scenes: '[[lights.scenes]]'
          active_scene: '[[lights.active_scene]]'
          color: '[[lights.color]]'
      - id: ac-heating
        if: [ac, heating]
        type: custom:mnml-heading-card
        title: Climate
        icon: mdi:thermostat
      - id: ac
        if: ac
        template: ac-item
        slots: { key: '[[key]]', entity: '[[ac.entity]]' }
      - id: heating
        if: heating
        template: heating-item
        slots: { key: '[[key]]', entity: '[[heating.entity]]', preset: '[[heating.preset]]' }
      - id: fans-humidifiers
        if: [fans, humidifiers]
        type: custom:mnml-heading-card
        title: Air
        icon: mdi:air-filter
      - id: each-fans
        each: fans
        as: fan
        template: fan-card
        slots: { entity: '[[fan.entity]]', quality: '[[fan.quality]]' }
      - id: each-humidifiers
        each: humidifiers
        as: humidifier
        template: humidifier-card
        slots: { entity: '[[humidifier.entity]]' }
      - id: covers
        if: covers
        type: custom:mnml-heading-card
        title: Covers
        icon: mdi:blinds-horizontal
      - id: each-covers
        each: covers
        as: cover
        template: cover-card
        slots: { entity: '[[cover.entity]]', garage: '[[cover.garage]]' }
      - id: cameras
        if: cameras
        type: custom:mnml-heading-card
        title: Cameras
        icon: mdi:cctv
      - id: each-cameras
        each: cameras
        as: camera
        template: camera-card
        slots: { entity: '[[camera.entity]]' }
      - id: camera-activity
        if: cameras
        template: camera-activity
        slots: { cameras: '[[cameras]]' }
      - id: appliances
        if: appliances
        type: custom:mnml-heading-card
        title: Appliances
        icon: mdi:washing-machine
      - id: each-appliances
        each: appliances
        as: appliance
        template: appliance-card
        slots:
          entity: '[[appliance.entity]]'
          remaining: '[[appliance.remaining]]'
          power: '[[appliance.power]]'
      - id: pets
        if: pets
        type: custom:mnml-heading-card
        title: Pets
        icon: mdi:paw
      - id: each-pets
        each: pets
        as: pet
        template: pet-card
        slots:
          feed: '[[pet.feed]]'
          fed: '[[pet.fed]]'
          food: '[[pet.food]]'
          litter: '[[pet.litter]]'
      - id: plants
        if: plants
        template: plants
        slots: { plants: '[[plants]]' }
      - id: media
        if: media
        type: custom:mnml-heading-card
        title: Media
        icon: mdi:multimedia
      - id: each-media
        each: media
        as: member
        template: room-media-card
        slots: { key: '[[key]]', member: '[[member]]' }
      - id: vacuum-printer3d-outlets-diffuser
        if: [vacuum, printer3d, outlets, diffuser]
        type: custom:mnml-heading-card
        title: Other
        icon: mdi:devices
      - id: vacuum
        if: vacuum
        template: vacuum-card
        slots: { key: '[[key]]', vacuum: '[[vacuum]]' }
      - id: printer3d
        if: printer3d
        template: 3d-printer-card
        slots: { key: '[[key]]', printer3d: '[[printer3d]]' }
      - id: each-outlets
        each: outlets
        as: outlet
        template: switch-card
        slots: { entity: '[[outlet.entity]]' }
      - id: diffuser
        if: diffuser
        template: diffuser-card
        slots: { entity: '[[diffuser.entity]]', amount: '[[diffuser.amount]]' }
      - id: batteries
        template: batteries
        slots: { batteries: '[[batteries]]', low: '[[low]]', critical: '[[critical]]' }
      - id: meters
        if: [outlets.*.energy, ac.energy]
        template: energy-table
        slots: { meters: ['[[outlets.*.energy]]', '[[ac.energy]]'] }
  example:
    key: kitchen
    name: Kitchen
    lights: { group: light.kitchen_lights }
