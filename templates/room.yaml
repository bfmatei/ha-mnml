        fan: { kind: flag }
        swing: { kind: flag }
        horizontal_swing: { kind: flag }
        power_saving: { kind: entity }
        dehumidifier: { kind: entity }
        energy:
          kind: object
          fields:
            power: { kind: entity }
            today: { kind: entity }
            total: { kind: entity }
    vacuum:
      kind: object
      fields:
        entity: { kind: entity, required: true }
        status: { kind: entity }
        error: { kind: entity }
        battery: { kind: entity }
        current_room: { kind: entity }
        progress: { kind: entity }
        area: { kind: entity }
        time: { kind: entity }
        last_clean: { kind: entity }
        mop_attached: { kind: entity }
        water_box_attached: { kind: entity }
        totals:
          kind: object
          fields:
            count: { kind: entity }
            area: { kind: entity }
            time: { kind: entity }
        map: { kind: entity }
        routines: { kind: entities }
        settings: { kind: entities }
        consumables:
          kind: objects
          fields:
            entity: { kind: entity }
            reset: { kind: entity }
        warnings: { kind: entities }
        dock:
          kind: object
          fields:
            error: { kind: entity }
            dust_emptying: { kind: entity }
            mop_drying: { kind: entity }
            mop_drying_time_left: { kind: entity }
            mop_washing: { kind: entity }
            consumables:
              kind: objects
              fields:
                entity: { kind: entity }
                reset: { kind: entity }
            warnings: { kind: entities }
    printer3d:
      kind: object
      fields:
        entity: { kind: entity, required: true }
        progress: { kind: entity }
        filename: { kind: entity }
        material: { kind: entity }
        speed: { kind: entity }
        start: { kind: entity }
        finish: { kind: entity }
        nozzle:
          kind: object
          fields:
            temperature: { kind: entity }
            target: { kind: entity }
        bed:
          kind: object
          fields:
            temperature: { kind: entity }
            target: { kind: entity }
        camera: { kind: entity }
        actions:
          kind: object
          required: true
          fields:
            pause: { kind: entity }
            resume: { kind: entity }
            continue: { kind: entity }
            cancel: { kind: entity }
        outlet:
          kind: object
          fields:
            entity: { kind: entity, required: true }
            energy:
              kind: object
              fields:
                power: { kind: entity }
                today: { kind: entity }
                total: { kind: entity }
    media:
      kind: objects
      fields:
        entity: { kind: entity, required: true }
        key: { kind: text }
    outlets:
      kind: objects
      fields:
        entity: { kind: entity, required: true }
        energy:
          kind: object
          fields:
            power: { kind: entity }
            today: { kind: entity }
            total: { kind: entity }
    diffuser:
      kind: object
      fields:
        entity: { kind: entity, required: true }
        amount: { kind: entity, required: true }
    batteries: { kind: entities }
    meters:
      kind: objects
      fields:
        power: { kind: entity, required: true }
        today: { kind: entity }
        total: { kind: entity }
  card:
    hash: '#[[key]]'
    cards:
      - id: header
        type: custom:mnml-header-card
        name: '[[name]]'
        icon: '[[icon]]'
        state:
          - id: temperature
            if: temperature
            entity: '[[temperature]]'
            icon: true
          - id: humidity
            if: humidity
            entity: '[[humidity]]'
            icon: true
        controls?:
          - id: lock
            if: lock
            type: toggle
            entity: '[[lock]]'
            color: red
            when: { is: [unlocked, open, jammed] }
          - id: window
            if: window
            type: indicator
            entity: '[[window]]'
            color: orange
          - id: door
            if: door
            type: indicator
            entity: '[[door]]'
            color: orange
      - id: heading
        if: lights.group
        type: custom:mnml-heading-card
        title: Lights
        icon: mdi:lightbulb-group
      - id: light-card
        if: lights.group
        template: light-card
        slots:
          entity: '[[lights.group]]'
          popup: '#[[key]]-lights'
          scenes: '[[lights.scenes]]'
          active_scene: '[[lights.active_scene]]'
          color: '[[lights.color]]'
      - id: ac-heating
        if: [ac, heating]
        type: custom:mnml-heading-card
        title: Climate
        icon: mdi:thermostat
      - id: ac
        if: ac
        template: ac-item
        slots: { key: '[[key]]', entity: '[[ac.entity]]' }
      - id: heating
        if: heating
        template: heating-item
        slots: { key: '[[key]]', entity: '[[heating.entity]]', preset: '[[heating.preset]]' }
      - id: media
        if: media
        type: custom:mnml-heading-card
        title: Media
        icon: mdi:multimedia
      - id: each-media
        each: media
        as: member
        template: room-media-card
        slots: { key: '[[key]]', member: '[[member]]' }
      - id: vacuum-printer3d-outlets-diffuser
        if: [vacuum, printer3d, outlets, diffuser]
        type: custom:mnml-heading-card
        title: Other
        icon: mdi:devices
      - id: vacuum
        if: vacuum
        template: vacuum-card
        slots: { key: '[[key]]', vacuum: '[[vacuum]]' }
      - id: printer3d
        if: printer3d
        template: 3d-printer-card
        slots: { key: '[[key]]', printer3d: '[[printer3d]]' }
      - id: each-outlets
        each: outlets
        as: outlet
        template: switch-card
        slots: { entity: '[[outlet.entity]]' }
      - id: diffuser
        if: diffuser
        template: diffuser-card
        slots: { entity: '[[diffuser.entity]]', amount: '[[diffuser.amount]]' }
      - id: batteries
        template: batteries
        slots: { batteries: '[[batteries]]' }
      - id: meters
        if: meters
        template: energy-table
        slots: { meters: '[[meters]]' }
  example:
    key: kitchen
    name: Kitchen
    lights: { group: light.kitchen_lights }
