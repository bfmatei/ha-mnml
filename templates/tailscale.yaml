tailscale:
  description: A tailnet's tile, and its offline, relayed and update chips; it brings the tailnet's pop-up.
  slots:
    devices:
      shape: tailscale_device
      kind: objects
      required: true
      group: Devices
      help: "The tailnet's devices, each with the sensors Tailscale reports for it."
      discover:
        per: device
        scope: all
        where: { domain: binary_sensor, platform: tailscale, translation_key: connected_to_control }
        fields:
          connected:
            { domain: binary_sensor, platform: tailscale, translation_key: connected_to_control }
          ip_address: { domain: sensor, platform: tailscale, translation_key: ip }
          last_seen: { domain: sensor, platform: tailscale, translation_key: last_seen }
          expires: { domain: sensor, platform: tailscale, translation_key: expires }
          update: { domain: binary_sensor, platform: tailscale, translation_key: client }
          udp: { domain: binary_sensor, platform: tailscale, translation_key: client_supports_udp }
    soon_days:
      {
        kind: number,
        default: 14,
        label: Key expires soon after,
        group: Devices,
        help: 'A key that expires within this many days is flagged red.',
      }
  retired: [essential, personal, updates, direct]
  card:
    type: custom:mnml-tile-card
    name: Tailscale
    icon: mdi:vpn
    popup: '#tailscale'
    chips:
      - id: offline
        if: devices.?essential
        type: status
        name: Offline
        icon: mdi:lan-disconnect
        silent: true
        rules:
          [
            {
              id: offline,
              if: devices.?essential,
              entities: ['[[devices.?essential.connected]]'],
              label: device,
              color: red,
              is: ['off'],
            },
          ]
      - id: relayed
        if: devices.*.udp
        type: status
        name: Relayed
        icon: mdi:transit-connection-variant
        silent: true
        rules:
          [
            {
              id: relayed,
              if: devices.*.udp,
              entities: ['[[devices.*.udp]]'],
              label: device,
              words: { 'off': Relayed },
              color: orange,
              is: ['off'],
            },
          ]
      - id: update
        if: devices.?essential.update
        type: status
        name: Update
        icon: mdi:package-up
        silent: true
        rules:
          [
            {
              id: update,
              if: devices.?essential.update,
              entities: ['[[devices.?essential.update]]'],
              label: device,
              color: amber,
              is: ['on'],
            },
          ]
    grid_options: { columns: 12 }
  popups:
    - id: tailscale-popup
      template: tailscale-popup
      slots: { devices: '[[devices]]', soon_days: '[[soon_days]]' }
  example: &tailscale
    devices:
      - connected: binary_sensor.router_connected
        essential: true
        ip_address: sensor.router_ip_address
        last_seen: sensor.router_last_seen
        expires: sensor.router_expires
        update: binary_sensor.router_client
        udp: binary_sensor.router_supports_udp
      - connected: binary_sensor.phone_connected

tailscale-popup:
  description: The tailnet's pop-up, a card per device, the essential ones under Infrastructure and the others under Devices.
  slots:
    devices: { shape: tailscale_device, kind: objects, required: true }
    soon_days: { kind: number, default: 14 }
  retired: [essential, personal]
  card:
    hash: '#tailscale'
    cards:
      - id: header
        type: custom:mnml-header-card
        name: Tailscale
        icon: mdi:vpn
      - id: infrastructure
        if: devices.?essential
        type: custom:mnml-heading-card
        title: Infrastructure
        icon: mdi:server-network
      - id: each-essential
        each: devices
        as: device
        if: device.essential
        template: tailscale-device
        slots: { device: '[[device]]', alert: red, soon_days: '[[soon_days]]' }
      - id: devices
        if: devices.!essential
        type: custom:mnml-heading-card
        title: Devices
        icon: mdi:devices
      - id: each-personal
        each: devices
        as: device
        unless: device.essential
        template: tailscale-device
        slots: { device: '[[device]]', soon_days: '[[soon_days]]' }
  example:
    devices:
      - connected: binary_sensor.router_connected
        essential: true
        ip_address: sensor.router_ip_address
        last_seen: sensor.router_last_seen
        expires: sensor.router_expires
        update: binary_sensor.router_client
        udp: binary_sensor.router_supports_udp
      - connected: binary_sensor.phone_connected
        last_seen: sensor.phone_last_seen

tailscale-device:
  description: A tailnet device's card, its name, Connected or when it was last seen, and icons for a pending update, a key about to expire and how it connects.
  slots:
    device: { shape: tailscale_device, required: true }
    alert:
      {
        kind: text,
        help: 'The colour of its icon while it is not connected, for a device that must stay connected.',
      }
    soon_days:
      {
        kind: number,
        default: 14,
        help: 'A key that expires within this many days is flagged red.',
      }
  card:
    type: custom:mnml-entity-card
    entity: '[[device.connected]]'
    label: device
    strip_word: Tailscale
    color?: '[[alert]]'
    when?: { if: alert, is: ['off'] }
    state:
      - id: ip
        if: device.ip_address
        entity: '[[device.ip_address]]'
    controls:
      - id: update
        if: device.update
        type: status
        name: Update
        icon: mdi:package-up
        silent: true
        rules:
          [
            {
              id: update,
              if: device.update,
              entities: ['[[device.update]]'],
              color: red,
              is: ['on'],
            },
          ]
      - id: key
        if: device.expires
        type: status
        name: Key expires soon
        icon: mdi:key-alert-outline
        silent: true
        rules:
          [
            {
              id: key,
              if: soon_days,
              entities: ['[[device.expires]]'],
              color: red,
              within_days: '[[soon_days]]',
            },
          ]
      - id: connection
        if: device.udp
        type: status
        name: Connection
        icon: mdi:transit-connection-variant
        rules:
          - id: relayed
            if: device.udp
            entities: ['[[device.udp]]']
            color: orange
            is: ['off']
            words: { 'off': Relayed }
          - id: direct
            if: device.udp
            entities: ['[[device.udp]]']
            color: blue
            is: ['on']
            words: { 'on': Direct }
      - id: connected
        type: status
        name: Connected
        icon: mdi:lan-connect
        silent: true
        rules:
          [
            {
              id: connected,
              entities: ['[[device.connected]]'],
              label: device,
              color: blue,
              is: ['on'],
            },
          ]
      - id: last-seen
        if: device.last_seen
        type: indicator
        entity: '[[device.last_seen]]'
        color: blue
        show: { entity: '[[device.connected]]', not: ['on'] }
  example:
    device:
      connected: binary_sensor.router_connected
      ip_address: sensor.router_ip_address
      last_seen: sensor.router_last_seen
      expires: sensor.router_expires
      update: binary_sensor.router_client
      udp: binary_sensor.router_supports_udp
