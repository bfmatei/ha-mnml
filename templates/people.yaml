person:
  description: A person's tile, whether they are driving or in a focus, and their devices' batteries; it brings the person's and each device's pop-up.
  title: Person
  icon: mdi:account
  slots:
    key:
      {
        kind: text,
        required: true,
        discover: area.id,
        group: Basics,
        label: 'Short name',
        help: "Names the person's pop-ups: jane gives #person-jane.",
      }
    entity: { kind: entity, required: true, label: Person, group: Basics, help: 'The person.' }
    health: { shape: health, group: Health }
    devices:
      shape: person_device_popup
      kind: objects
      group: Devices
      fields: { tracker: { required: true } }
    low: { kind: number, default: 20, label: Low battery, group: Devices }
    critical: { kind: number, default: 5, label: Critical battery, group: Devices }
    square: { shape: square }
  retired: [activities, focuses, batteries]
  card:
    type: custom:mnml-tile-card
    entity: '[[entity]]'
    popup: '#person-[[key]]'
    state: [{ id: part }]
    square: '[[square]]'
    chips?:
      - id: person-status
        template: person-status
        slots: { devices: '[[devices]]', low: '[[low]]', critical: '[[critical]]' }
    grid_options: { columns: 12 }
  popups:
    - id: person-popup
      template: person-popup
      slots:
        key: '[[key]]'
        entity: '[[entity]]'
        health: '[[health]]'
        devices: '[[devices]]'
        low: '[[low]]'
        critical: '[[critical]]'
    - id: each-devices
      each: devices
      as: device
      template: device-popup
      slots:
        key: '[[key]]'
        entity: '[[entity]]'
        device: '[[device]]'
        low: '[[low]]'
        critical: '[[critical]]'
  example:
    key: alex
    entity: person.alex
    devices:
      [
        {
          key: phone,
          name: Phone,
          icon: mdi:cellphone,
          tracker: device_tracker.alex_phone,
          battery: sensor.alex_phone_battery,
          battery_state: sensor.alex_phone_battery_state,
          storage: sensor.alex_phone_storage,
          connection: sensor.alex_phone_connection,
          network: sensor.alex_phone_ssid,
          activity: sensor.alex_phone_activity,
          focus: binary_sensor.alex_phone_focus,
          permission: sensor.alex_phone_location_permission,
        },
      ]

person-status:
  description: "A person's Driving and Do not disturb icons, and their devices' Batteries icon, each drawn only while it holds."
  title: Person status
  icon: mdi:account-outline
  slots:
    devices: { shape: person_device, kind: objects }
    low: { kind: number, default: 20 }
    critical: { kind: number, default: 5 }
  card:
    - id: driving
      if: devices.*.activity
      type: status
      name: '[[words.driving]]'
      icon: mdi:steering
      silent: true
      rules:
        [
          {
            id: activities,
            if: devices.*.activity,
            entities: ['[[devices.*.activity]]'],
            color: amber,
            is: [automotive],
          },
        ]
    - id: do-not-disturb
      if: devices.*.focus
      type: status
      name: '[[words.do_not_disturb]]'
      icon: mdi:moon-waning-crescent
      silent: true
      rules:
        [
          {
            id: focuses,
            if: devices.*.focus,
            entities: ['[[devices.*.focus]]'],
            color: amber,
            is: ['on'],
          },
        ]
    - id: batteries
      if: devices.*.battery
      type: status
      name: '[[words.batteries]]'
      icon: mdi:battery-alert-variant-outline
      silent: true
      rules:
        - {
            id: critical,
            if: critical,
            entities: '[[devices.*.battery]]',
            below: '[[critical]]',
            color: red,
            label: device,
          }
        - {
            id: low,
            if: low,
            entities: '[[devices.*.battery]]',
            below: '[[low]]',
            color: orange,
            label: device,
          }
  example:
    devices:
      - key: phone
        activity: sensor.alex_phone_activity
        focus: binary_sensor.alex_phone_focus
        battery: sensor.alex_phone_battery

device-card:
  description: A person's device as an item, its place and battery, opening its pop-up.
  title: Personal device
  icon: mdi:cellphone
  slots:
    key: { kind: text, required: true }
    device: { shape: person_device, required: true, fields: { tracker: { required: true } } }
  card:
    type: custom:mnml-entity-card
    entity: '[[device.tracker]]'
    name: '[[device.name]]'
    icon: '[[device.icon]]'
    state:
      [
        { id: part },
        { id: device-battery, if: device.battery, entity: '[[device.battery]]', icon: true },
      ]
    popup: '#person-[[key]]-[[device.key]]'
  example:
    key: alex
    device:
      {
        key: phone,
        name: Phone,
        icon: mdi:cellphone,
        tracker: device_tracker.alex_phone,
        battery: sensor.alex_phone_battery,
      }

person-popup:
  description: "A person's pop-up: the tile's driving, focus and battery icons in its header, their devices, their location access and their health."
  title: Person pop-up
  icon: mdi:account
  slots:
    key: { kind: text, required: true }
    entity: { kind: entity, required: true }
    health: { shape: health }
    devices:
      shape: person_device
      kind: objects
      fields: { tracker: { required: true }, permission: { required: true } }
    low: { kind: number, default: 20 }
    critical: { kind: number, default: 5 }
  card:
    hash: '#person-[[key]]'
    cards:
      - id: header
        type: custom:mnml-header-card
        entity: '[[entity]]'
        state: [{ id: part }]
        controls?:
          - id: person-status
            template: person-status
            slots: { devices: '[[devices]]', low: '[[low]]', critical: '[[critical]]' }
      - id: heading
        if: devices
        type: custom:mnml-heading-card
        title: '[[words.devices]]'
        icon: mdi:cellphone-link
      - id: each-devices
        each: devices
        as: device
        template: device-card
        slots: { key: '[[key]]', device: '[[device]]' }
      - id: location-access
        if: devices
        type: custom:mnml-list-card
        title: '[[words.location_access]]'
        icon: mdi:map-marker-alert
        rows:
          - id: each-devices
            each: devices
            as: device
            entity: '[[device.permission]]'
            name: '[[device.name]]'
            color: orange
            show: { not: [authorized always] }
      - id: health
        if: health
        type: custom:mnml-list-card
        title: '[[words.health]]'
        icon: mdi:heart-pulse
        rows:
          - id: health-steps
            entity: '[[health.steps]]'
            zero_when_empty: true
          - id: health-distance
            entity: '[[health.distance]]'
            zero_when_empty: true
          - id: health-flights_climbed
            entity: '[[health.flights_climbed]]'
            zero_when_empty: true
          - id: health-active_energy
            entity: '[[health.active_energy]]'
            zero_when_empty: true
          - id: health-resting_energy
            entity: '[[health.resting_energy]]'
            zero_when_empty: true
  example:
    key: alex
    entity: person.alex
    devices:
      [
        {
          key: phone,
          name: Phone,
          icon: mdi:cellphone,
          tracker: device_tracker.alex_phone,
          battery: sensor.alex_phone_battery,
          permission: sensor.alex_phone_location_permission,
        },
      ]

device-popup:
  description: "A person's device pop-up: its place and battery in its header, its battery and its details."
  title: Personal device pop-up
  icon: mdi:cellphone
  slots:
    key: { kind: text, required: true }
    entity: { kind: entity }
    device: { shape: person_device_popup, required: true }
    low: { kind: number, default: 20 }
    critical: { kind: number, default: 5 }
  card:
    hash: '#person-[[key]]-[[device.key]]'
    cards:
      - id: header
        type: custom:mnml-header-card
        name: '[[device.name]]'
        icon: '[[device.icon]]'
        entity: '[[device.tracker]]'
        state:
          - { id: entity, if: entity, entity: '[[entity]]', name: true }
          - { id: part }
        back: true
      - id: battery
        type: custom:mnml-list-card
        title: '[[words.battery]]'
        icon: mdi:battery-charging-medium
        rows:
          - id: device-battery
            entity: '[[device.battery]]'
            bar: true
            low: '[[low]]'
            critical: '[[critical]]'
          - id: device-battery_state
            entity: '[[device.battery_state]]'
      - id: details
        type: custom:mnml-list-card
        title: '[[words.details]]'
        icon: mdi:information-outline
        rows:
          - id: device-storage
            entity: '[[device.storage]]'
          - id: device-connection
            entity: '[[device.connection]]'
          - id: device-network
            entity: '[[device.network]]'
          - id: device-activity
            entity: '[[device.activity]]'
          - id: device-focus
            entity: '[[device.focus]]'
          - id: device-focus_name
            if: device.focus_name
            entity: '[[device.focus_name]]'
          - id: device-permission
            entity: '[[device.permission]]'
            color: orange
            when: { not: [authorized always] }
  example:
    key: alex
    entity: person.alex
    device:
      {
        key: phone,
        name: Phone,
        icon: mdi:cellphone,
        tracker: device_tracker.alex_phone,
        battery: sensor.alex_phone_battery,
        battery_state: sensor.alex_phone_battery_state,
        storage: sensor.alex_phone_storage,
        connection: sensor.alex_phone_connection,
        network: sensor.alex_phone_ssid,
        activity: sensor.alex_phone_activity,
        focus: binary_sensor.alex_phone_focus,
        permission: sensor.alex_phone_location_permission,
      }
