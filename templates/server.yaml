proxmox-server:
  description: A Proxmox VE server's tile, its CPU and memory, and its guests, checks, backups and notifications chips; it brings the server's and the notifications' pop-ups. The checks, backups and notifications read sensors that the server's own jobs keep.
  title: Proxmox VE server
  icon: mdi:server
  slots:
    outlet:
      shape: outlet
      help: 'The outlet the server is plugged into, with its power.'
      group: Power
      fields: { energy: { fields: { power: { required: true } } } }
    cpu:
      kind: entity
      label: CPU
      group: Load
      help: "The server's processor use."
      discover: { domain: sensor, platform: proxmoxve, translation_key: node_cpu, scope: all }
    memory:
      kind: entity
      group: Load
      help: "The server's memory use."
      discover:
        { domain: sensor, platform: proxmoxve, translation_key: node_memory_percentage, scope: all }
    last_boot:
      kind: entity
      group: Load
      label: 'Last boot'
      help: 'When the server last started.'
      discover: { domain: sensor, platform: proxmoxve, translation_key: node_uptime, scope: all }
    uplink: { kind: entity, group: Load }
    temperatures: { shape: server_temperatures, group: Load }
    storage: { kind: entities, group: Storage }
    disks: { shape: server_disks, group: Storage }
    guests:
      shape: guest
      kind: objects
      group: Guests
      discover:
        per: device
        scope: all
        where: { domain: binary_sensor, platform: proxmoxve, translation_key: status }
        fields:
          status: { domain: binary_sensor, platform: proxmoxve, translation_key: status }
          cpu:
            [
              { domain: sensor, platform: proxmoxve, translation_key: vm_cpu },
              { domain: sensor, platform: proxmoxve, translation_key: container_cpu },
            ]
          memory:
            [
              { domain: sensor, platform: proxmoxve, translation_key: vm_memory_percentage },
              { domain: sensor, platform: proxmoxve, translation_key: container_memory_percentage },
            ]
    backups:
      shape: server_backups
      group: Health
      discover:
        fields:
          last:
            {
              domain: sensor,
              platform: proxmoxve,
              translation_key: node_backup_last_backup,
              scope: all,
            }
          problem:
            {
              domain: binary_sensor,
              platform: proxmoxve,
              translation_key: node_backup_status,
              scope: all,
            }
    checks: { shape: checks, group: Health }
    notifications: { shape: notifications, group: Health, fields: { clear: { required: true } } }
    message_sources:
      { shape: message_source, kind: objects, label: 'Message sources', group: Health }
    disk_high: { kind: number, default: 80, group: Thresholds, label: 'Disk high' }
    disk_full: { kind: number, default: 90, group: Thresholds, label: 'Disk full' }
    disk_life_low: { kind: number, default: 20, group: Thresholds, label: 'Disk life low' }
    disk_life_critical:
      { kind: number, default: 10, group: Thresholds, label: 'Disk life critical' }
    cpu_hot: { kind: number, default: 85, label: CPU hot, group: Thresholds }
    cpu_critical: { kind: number, default: 95, label: CPU critical, group: Thresholds }
    root_disk_hot: { kind: number, default: 70, group: Thresholds, label: 'Root disk hot' }
    root_disk_critical:
      { kind: number, default: 80, group: Thresholds, label: 'Root disk critical' }
    bucket_high: { kind: number, default: 18, group: Thresholds, label: 'Bucket high' }
    bucket_full: { kind: number, default: 19, group: Thresholds, label: 'Bucket full' }
    square: { shape: square }
  retired: [guest_statuses]
  card:
    type: custom:mnml-tile-card
    name: '[[words.server]]'
    icon: mdi:server
    popup: '#proxmox'
    state:
      - id: cpu
        if: cpu
        entity: '[[cpu]]'
        icon: true
      - id: memory
        if: memory
        entity: '[[memory]]'
        icon: true
    square: '[[square]]'
    chips:
      - id: status
        if: guests.*.status
        type: status
        name: '[[words.guests]]'
        icon: mdi:server-network
        silent: true
        rules:
          [
            {
              id: guest-statuses,
              if: guests.*.status,
              entities: ['[[guests.*.status]]'],
              label: device,
              color: red,
              is: ['off'],
            },
          ]
      - id: checks
        if: checks
        type: status
        name: '[[words.checks]]'
        icon: mdi:clipboard-check-outline
        silent: true
        rules:
          - id: checks-failed
            entities: ['[[checks.failed]]']
            color: red
            not: ['0', unknown, unavailable]
          - id: checks-warnings
            if: checks.warnings
            entities: ['[[checks.warnings]]']
            color: orange
            not: ['0', unknown, unavailable]
          - id: checks-overdue
            entities: ['[[checks.overdue]]']
            color: orange
            is: ['on']
      - id: backups
        if: backups
        type: status
        name: '[[words.backups]]'
        icon: mdi:cloud-upload-outline
        silent: true
        rules: [{ id: backups-problem, entities: ['[[backups.problem]]'], color: red, is: ['on'] }]
      - id: notifications
        if: notifications
        type: nav
        entity: '[[notifications.messages]]'
        popup: '#proxmox-notifications'
        color: amber
        when: { attribute: alerts, not: ['0'] }
        show: { attribute: alerts, not: ['0'] }
    grid_options: { columns: 12 }
  popups:
    - id: proxmox-popup
      template: proxmox-popup
      slots:
        outlet: '[[outlet]]'
        cpu: '[[cpu]]'
        memory: '[[memory]]'
        last_boot: '[[last_boot]]'
        uplink: '[[uplink]]'
        temperatures: '[[temperatures]]'
        storage: '[[storage]]'
        disks: '[[disks]]'
        guests: '[[guests]]'
        backups: '[[backups]]'
        checks: '[[checks]]'
        notifications: '[[notifications]]'
        message_sources: '[[message_sources]]'
        disk_high: '[[disk_high]]'
        disk_full: '[[disk_full]]'
        disk_life_low: '[[disk_life_low]]'
        disk_life_critical: '[[disk_life_critical]]'
        cpu_hot: '[[cpu_hot]]'
        cpu_critical: '[[cpu_critical]]'
        root_disk_hot: '[[root_disk_hot]]'
        root_disk_critical: '[[root_disk_critical]]'
        bucket_high: '[[bucket_high]]'
        bucket_full: '[[bucket_full]]'
    - id: notifications
      if: notifications
      template: notifications-popup
      slots:
        notifications: '[[notifications]]'
        message_sources: '[[message_sources]]'
  example: &server
    outlet: { entity: switch.server_outlet }
    cpu: sensor.server_cpu
    memory: sensor.server_memory
    last_boot: sensor.server_last_boot
    guests:
      [{ status: binary_sensor.guest_status, cpu: sensor.guest_cpu, memory: sensor.guest_memory }]

proxmox-popup:
  description: The server's pop-up, its notifications, stopped guests, checks, host, disks, storage, energy, guests and backups.
  title: Proxmox VE pop-up
  icon: mdi:server
  slots:
    outlet: { shape: outlet, fields: { energy: { fields: { power: { required: true } } } } }
    cpu: { kind: entity }
    memory: { kind: entity }
    last_boot: { kind: entity }
    uplink: { kind: entity }
    temperatures: { shape: server_temperatures }
    storage: { kind: entities }
    disks: { shape: server_disks }
    guests: { shape: guest, kind: objects }
    backups: { shape: server_backups }
    checks: { shape: checks }
    notifications: { shape: notifications }
    message_sources: { shape: message_source, kind: objects }
    disk_high: { kind: number, default: 80 }
    disk_full: { kind: number, default: 90 }
    disk_life_low: { kind: number, default: 20 }
    disk_life_critical: { kind: number, default: 10 }
    cpu_hot: { kind: number, default: 85 }
    cpu_critical: { kind: number, default: 95 }
    root_disk_hot: { kind: number, default: 70 }
    root_disk_critical: { kind: number, default: 80 }
    bucket_high: { kind: number, default: 18 }
    bucket_full: { kind: number, default: 19 }
  retired: [guest_statuses]
  card:
    hash: '#proxmox'
    cards:
      - id: header
        type: custom:mnml-header-card
        name: '[[words.server]]'
        icon: mdi:server
      - id: notifications
        if: notifications
        type: custom:mnml-entity-card
        entity: '[[notifications.messages]]'
        color: amber
        when: { attribute: alerts, not: ['0'] }
        state:
          - id: none
            text: '[[words.none]]'
            when: { is: ['0'] }
          - id: part-2
            when: { not: ['0'] }
        popup: '#proxmox-notifications'
      - id: stopped
        type: custom:mnml-list-card
        title: '[[words.stopped]]'
        icon: mdi:stop-circle-outline
        rows:
          - id: each-guests
            each: guests
            as: guest
            template: stopped-row
            slots: { entity: '[[guest.status]]' }
      - id: checks
        if: checks
        type: custom:mnml-entity-card
        entity: '[[checks.last_run]]'
        name: '[[words.checks]]'
        icon: mdi:clipboard-check-outline
        state:
          - id: last-run
            relative: true
        popup: '#checks'
        controls:
          - id: checks-controls
            template: checks-controls
            slots: { checks: '[[checks]]' }
      - id: host
        type: custom:mnml-list-card
        title: '[[words.host]]'
        icon: mdi:harddisk
        rows:
          - id: outlet-entity
            if: outlet.entity
            entity: '[[outlet.entity]]'
            color: orange
            when: { is: ['off'] }
          - id: cpu
            if: cpu
            entity: '[[cpu]]'
          - id: memory
            if: memory
            entity: '[[memory]]'
            bar: true
          - id: last_boot
            if: last_boot
            entity: '[[last_boot]]'
            relative: true
          - id: uplink
            if: uplink
            template: link-row
            slots: { entity: '[[uplink]]' }
          - id: temperatures
            if: temperatures
            entity: '[[temperatures.cpu]]'
            high: '[[cpu_hot]]'
            critical_high: '[[cpu_critical]]'
          - id: temperatures-2
            if: temperatures
            entity: '[[temperatures.root_disk]]'
            high: '[[root_disk_hot]]'
            critical_high: '[[root_disk_critical]]'
      - id: disks
        if: disks
        type: custom:mnml-list-card
        title: '[[words.disks]]'
        icon: mdi:harddisk
        rows:
          - id: disks-pool
            entity: '[[disks.pool]]'
            color: red
            when: { not: [ONLINE] }
          - id: disks-failing
            entity: '[[disks.failing]]'
            color: red
            when: { not: ['0'] }
          - id: disks-life_left
            entity: '[[disks.life_left]]'
            bar: true
            low: '[[disk_life_low]]'
            critical: '[[disk_life_critical]]'
      - id: storage
        type: custom:mnml-list-card
        fold: true
        summary: highest
        title: '[[words.storage]]'
        icon: mdi:database
        rows:
          - id: each-storage
            each: storage
            as: store
            entity: '[[store]]'
            label: device
            bar: true
      - id: outlet-energy
        if: outlet.energy
        template: energy-table
        slots: { meters: ['[[outlet.energy]]'] }
      - id: guests
        type: custom:mnml-list-card
        title: '[[words.guests]]'
        icon: mdi:server-network
        headers: ['[[words.guest]]', '[[words.cpu]]', '[[words.memory]]', '[[words.disk]]']
        rows:
          - id: each-guests
            each: guests
            as: guest
            entity: '[[guest.status]]'
            label: device
            values!: ['[[guest.cpu]]', '[[guest.memory]]', '[[guest.disk.used]]']
            of: '[[guest.disk.size]]'
            high: '[[disk_high]]'
            critical_high: '[[disk_full]]'
      - id: backups
        if: backups
        type: custom:mnml-list-card
        title: '[[words.backups]]'
        icon: mdi:cloud-upload-outline
        rows:
          - id: backups-last
            entity: '[[backups.last]]'
            relative: true
          - id: backups-problem
            entity: '[[backups.problem]]'
            color: red
            show: { is: ['on'] }
          - id: backups-bucket
            if: backups.bucket
            entity: '[[backups.bucket]]'
            high: '[[bucket_high]]'
            critical_high: '[[bucket_full]]'
  example: *server

notifications-popup:
  description: "The server's notifications pop-up: how many are kept in its header, every message and a button that clears them all, which asks first."
  title: Notifications pop-up
  icon: mdi:bell-outline
  slots:
    notifications: { shape: notifications, required: true, fields: { clear: { required: true } } }
    message_sources: { shape: message_source, kind: objects }
  card:
    hash: '#proxmox-notifications'
    cards:
      - id: header
        type: custom:mnml-header-card
        entity: '[[notifications.messages]]'
        color: amber
        when: { attribute: alerts, not: ['0'] }
        state:
          - { id: server, text: '[[words.server]]' }
          - { id: none, text: '[[words.none]]', when: { is: ['0'] } }
          - { id: part, when: { not: ['0'] } }
        controls:
          - id: service
            type: service
            entity: '[[notifications.clear]]'
            service: script.turn_on
            confirm: {}
            name: '[[words.clear_all]]'
            icon: mdi:notification-clear-all
            show: { entity: '[[notifications.messages]]', not: ['0'] }
        back: true
      - id: messages
        type: custom:mnml-messages-card
        entity: '[[notifications.messages]]'
        clear: '[[notifications.clear]]'
        sources?: '[[message_sources]]'
  example:
    notifications: { messages: sensor.messages, clear: script.clear_messages }
