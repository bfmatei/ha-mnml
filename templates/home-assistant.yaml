home-assistant:
  description: Home Assistant's tile, its memory and free disk, and its services, updates and firmware chips; it brings its pop-up, with each room's firmware.
  slots:
    cpu:
      help: "Home Assistant's processor use."
      kind: entity
      label: CPU
      group: Load
      discover:
        { domain: sensor, platform: systemmonitor, translation_key: processor_use, scope: all }
    memory:
      help: "Home Assistant's memory use, as a share."
      kind: entity
      group: Load
      discover:
        { domain: sensor, platform: systemmonitor, translation_key: memory_use_percent, scope: all }
    disk_free:
      label: 'Disk free'
      help: 'The free space on its disk.'
      kind: entity
      group: Load
      discover:
        - { domain: sensor, platform: hassio, translation_key: disk_free, scope: all }
        - { domain: sensor, platform: systemmonitor, translation_key: disk_free, scope: all }
    disk_used:
      label: 'Disk used'
      help: 'The space used on its disk.'
      kind: entity
      group: Load
      discover:
        - { domain: sensor, platform: hassio, translation_key: disk_used, scope: all }
        - { domain: sensor, platform: systemmonitor, translation_key: disk_use, scope: all }
    services: { kind: entities, group: Updates }
    updates:
      kind: entities
      group: Updates
      discover: { domain: update, platform: hassio, scope: all }
    firmware: { kind: entities, group: Updates }
    backups:
      kind: object
      group: Updates
      fields:
        last: { kind: entity, required: true }
        attempted: { kind: entity }
    all_firmware:
      {
        label: 'All firmware',
        kind: entities,
        discover: { domain: update, device_class: firmware, scope: all },
        group: Updates,
      }
    room_firmware:
      label: 'Firmware by room'
      kind: objects
      group: Updates
      fields:
        name: { kind: text, required: true }
        firmware: { kind: entities }
      discover:
        {
          per: area,
          scope: all,
          fields: { name: area.name, firmware: { domain: update, device_class: firmware } },
        }
  card:
    type: custom:mnml-tile-card
    name: Home Assistant
    icon: mdi:home-assistant
    popup: '#system'
    state:
      - id: memory
        if: memory
        entity: '[[memory]]'
        icon: true
      - id: disk_free
        if: disk_free
        entity: '[[disk_free]]'
        icon: true
    chips:
      - id: services
        if: services
        type: status
        name: Services
        icon: mdi:lan-connect
        rules:
          [
            {
              id: services,
              if: services,
              entities: ['[[services]]'],
              label: device,
              color: red,
              is: ['off'],
            },
          ]
      - id: updates
        if: updates
        type: status
        name: Updates
        icon: mdi:package-up
        rules:
          [
            {
              id: updates,
              if: updates,
              entities: ['[[updates]]'],
              label: device,
              color: amber,
              is: ['on'],
            },
          ]
      - id: firmware
        if: all_firmware
        type: status
        name: Firmware
        icon: mdi:memory
        rules:
          [
            {
              id: all-firmware,
              if: all_firmware,
              entities: ['[[all_firmware]]'],
              label: device,
              color: amber,
              is: ['on'],
            },
          ]
    grid_options: { columns: 12 }
  popups:
    - id: system-popup
      template: system-popup
      slots:
        cpu: '[[cpu]]'
        memory: '[[memory]]'
        disk_free: '[[disk_free]]'
        disk_used: '[[disk_used]]'
        services: '[[services]]'
        updates: '[[updates]]'
        firmware: '[[firmware]]'
        backups: '[[backups]]'
        all_firmware: '[[all_firmware]]'
        room_firmware: '[[room_firmware]]'
  example: &home_assistant
    cpu: sensor.ha_cpu
    memory: sensor.ha_memory
    disk_free: sensor.ha_disk_free
    disk_used: sensor.ha_disk_used
    services: [binary_sensor.matter_server]
    updates: [update.home_assistant_core]
    firmware: [update.zigbee_firmware]
    backups:
      last: sensor.backup_last_successful_automatic_backup
      attempted: sensor.backup_last_attempted_automatic_backup
    all_firmware: [update.zigbee_firmware, update.kitchen_plug_firmware]
    room_firmware: [{ name: Kitchen, firmware: [update.kitchen_plug_firmware] }]

system-popup:
  description: Home Assistant's pop-up, its resources, backups, services, updates, its own firmware and each room's.
  slots:
    cpu: { kind: entity }
    memory: { kind: entity }
    disk_free: { kind: entity }
    disk_used: { kind: entity }
    services: { kind: entities }
    updates: { kind: entities }
    firmware: { kind: entities }
    backups:
      kind: object
      fields:
        last: { kind: entity, required: true }
        attempted: { kind: entity }
    all_firmware:
      { kind: entities, discover: { domain: update, device_class: firmware, scope: all } }
    room_firmware:
      kind: objects
      fields:
        name: { kind: text, required: true }
        firmware: { kind: entities }
      discover:
        {
          per: area,
          scope: all,
          fields: { name: area.name, firmware: { domain: update, device_class: firmware } },
        }
  card:
    hash: '#system'
    cards:
      - id: header
        type: custom:mnml-header-card
        name: Home Assistant
        icon: mdi:home-assistant
        state:
          - id: memory
            if: memory
            entity: '[[memory]]'
            icon: true
          - id: disk_free
            if: disk_free
            entity: '[[disk_free]]'
            icon: true
      - id: resources
        type: custom:mnml-list-card
        title: Resources
        icon: mdi:chip
        rows:
          - id: cpu
            if: cpu
            entity: '[[cpu]]'
          - id: memory
            if: memory
            entity: '[[memory]]'
            bar: true
          - id: disk_used
            if: disk_used
            entity: '[[disk_used]]'
          - id: disk_free
            if: disk_free
            entity: '[[disk_free]]'
      - id: backups
        if: backups
        type: custom:mnml-list-card
        title: Backups
        icon: mdi:cloud-upload-outline
        rows:
          - id: backups-last
            entity: '[[backups.last]]'
            relative: true
          - id: backups-attempted
            if: backups.attempted
            entity: '[[backups.attempted]]'
            relative: true
      - id: services
        type: custom:mnml-list-card
        title: Services
        icon: mdi:lan-connect
        rows:
          - id: each-services
            each: services
            as: service
            template: stopped-row
            slots: { entity: '[[service]]' }
      - id: updates
        type: custom:mnml-list-card
        title: Updates
        icon: mdi:package-up
        rows:
          - id: each-updates
            each: updates
            as: update
            template: pending-row
            slots: { entity: '[[update]]' }
      - id: firmware
        type: custom:mnml-list-card
        title: Firmware
        icon: mdi:memory
        rows:
          - id: each-firmware
            each: firmware
            as: update
            template: pending-row
            slots: { entity: '[[update]]' }
      - id: each-room_firmware
        each: room_firmware
        as: room
        type: custom:mnml-list-card
        title: '[[room.name]] firmware'
        icon: mdi:memory
        rows:
          - id: each-room-firmware
            each: room.firmware
            as: update
            template: pending-row
            slots: { entity: '[[update]]' }
  example: *home_assistant
