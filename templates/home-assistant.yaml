home-assistant:
  description: Home Assistant's tile, its memory and free disk, and its services, updates, firmware and messages chips; it brings its pop-up, with each room's firmware, and its messages' pop-up.
  title: Home Assistant
  icon: mdi:home-assistant
  slots:
    cpu:
      help: "Home Assistant's processor use."
      kind: entity
      label: CPU
      group: Load
      discover:
        { domain: sensor, platform: systemmonitor, translation_key: processor_use, scope: all }
    memory:
      help: "Home Assistant's memory use, as a share."
      kind: entity
      group: Load
      discover:
        { domain: sensor, platform: systemmonitor, translation_key: memory_use_percent, scope: all }
    disk_free:
      label: 'Disk free'
      help: 'The free space on its disk.'
      kind: entity
      group: Load
      discover:
        - { domain: sensor, platform: hassio, translation_key: disk_free, scope: all }
        - { domain: sensor, platform: systemmonitor, translation_key: disk_free, scope: all }
    disk_used:
      label: 'Disk used'
      help: 'The space used on its disk.'
      kind: entity
      group: Load
      discover:
        - { domain: sensor, platform: hassio, translation_key: disk_used, scope: all }
        - { domain: sensor, platform: systemmonitor, translation_key: disk_use, scope: all }
    services: { kind: entities, group: Updates }
    updates:
      kind: entities
      group: Updates
      discover: { domain: update, platform: hassio, scope: all }
    firmware: { kind: entities, group: Updates }
    backups: { shape: system_backups, group: Updates }
    all_firmware:
      {
        label: 'All firmware',
        kind: entities,
        discover: { domain: update, device_class: firmware, scope: all },
        group: Updates,
      }
    room_firmware:
      shape: room_firmware
      kind: objects
      label: 'Firmware by room'
      group: Updates
      discover:
        {
          per: area,
          scope: all,
          fields: { name: area.name, firmware: { domain: update, device_class: firmware } },
        }
    square: { shape: square }
  card:
    type: custom:mnml-tile-card
    name: '[[words.home_assistant]]'
    icon: mdi:home-assistant
    popup: '#system'
    state:
      - id: memory
        if: memory
        entity: '[[memory]]'
        icon: true
      - id: disk_free
        if: disk_free
        entity: '[[disk_free]]'
        icon: true
    square: '[[square]]'
    chips:
      - id: services
        if: services
        type: status
        name: '[[words.services]]'
        icon: mdi:lan-connect
        silent: true
        rules:
          [
            {
              id: services,
              if: services,
              entities: ['[[services]]'],
              label: device,
              color: red,
              is: ['off'],
            },
          ]
      - id: updates
        if: updates
        type: status
        name: '[[words.updates]]'
        icon: mdi:package-up
        silent: true
        rules:
          [
            {
              id: updates,
              if: updates,
              entities: ['[[updates]]'],
              label: device,
              color: amber,
              is: ['on'],
            },
          ]
      - id: firmware
        if: [all_firmware, firmware, room_firmware]
        type: status
        name: '[[words.firmware]]'
        icon: mdi:memory
        silent: true
        rules:
          - id: all-firmware
            if: all_firmware
            entities: ['[[all_firmware]]']
            label: device
            color: amber
            is: ['on']
          - id: firmware
            if: firmware
            unless: all_firmware
            entities: '[[firmware]]'
            label: device
            color: amber
            is: ['on']
          - id: each-room_firmware
            each: room_firmware
            as: room
            if: room.firmware
            unless: all_firmware
            entities: '[[room.firmware]]'
            label: device
            color: amber
            is: ['on']
      - id: messages
        type: messages
        popup: '#system-messages'
        name: '[[words.messages]]'
        icon: mdi:bell-badge-outline
        color: amber
    grid_options: { columns: 12 }
  popups:
    - id: system-messages-popup
      template: system-messages-popup
    - id: system-popup
      template: system-popup
      slots:
        cpu: '[[cpu]]'
        memory: '[[memory]]'
        disk_free: '[[disk_free]]'
        disk_used: '[[disk_used]]'
        services: '[[services]]'
        updates: '[[updates]]'
        firmware: '[[firmware]]'
        backups: '[[backups]]'
        all_firmware: '[[all_firmware]]'
        room_firmware: '[[room_firmware]]'
  example: &home_assistant
    cpu: sensor.ha_cpu
    memory: sensor.ha_memory
    disk_free: sensor.ha_disk_free
    disk_used: sensor.ha_disk_used
    services: [binary_sensor.matter_server]
    updates: [update.home_assistant_core]
    firmware: [update.zigbee_firmware]
    backups:
      last: sensor.backup_last_successful_automatic_backup
      attempted: sensor.backup_last_attempted_automatic_backup
      problem: binary_sensor.backup_problem
    all_firmware: [update.zigbee_firmware, update.kitchen_plug_firmware]
    room_firmware: [{ name: Kitchen, firmware: [update.kitchen_plug_firmware] }]

system-popup:
  description: "Home Assistant's pop-up: how many messages it has, opening their pop-up, then its resources, backups, services, updates, its own firmware and each room's."
  title: Home Assistant pop-up
  icon: mdi:home-assistant
  slots:
    cpu: { kind: entity }
    memory: { kind: entity }
    disk_free: { kind: entity }
    disk_used: { kind: entity }
    services: { kind: entities }
    updates: { kind: entities }
    firmware: { kind: entities }
    backups: { shape: system_backups }
    all_firmware:
      { kind: entities, discover: { domain: update, device_class: firmware, scope: all } }
    room_firmware:
      shape: room_firmware
      kind: objects
      discover:
        {
          per: area,
          scope: all,
          fields: { name: area.name, firmware: { domain: update, device_class: firmware } },
        }
  card:
    hash: '#system'
    cards:
      - id: header
        type: custom:mnml-header-card
        name: '[[words.home_assistant]]'
        icon: mdi:home-assistant
      - id: messages-row
        type: custom:mnml-messages-card
        popup: '#system-messages'
        name: '[[words.messages]]'
        icon: mdi:bell-outline
        color: amber
      - id: resources
        type: custom:mnml-list-card
        title: '[[words.resources]]'
        icon: mdi:chip
        rows:
          - id: cpu
            if: cpu
            entity: '[[cpu]]'
          - id: memory
            if: memory
            entity: '[[memory]]'
            bar: true
          - id: disk_used
            if: disk_used
            entity: '[[disk_used]]'
          - id: disk_free
            if: disk_free
            entity: '[[disk_free]]'
      - id: backups
        if: backups
        type: custom:mnml-list-card
        title: '[[words.backups]]'
        icon: mdi:cloud-upload-outline
        rows:
          - id: backups-last
            entity: '[[backups.last]]'
            relative: true
          - id: backups-attempted
            if: backups.attempted
            entity: '[[backups.attempted]]'
            relative: true
          - id: backups-problem
            if: backups.problem
            entity: '[[backups.problem]]'
            color: red
            show: { is: ['on'] }
      - id: services
        type: custom:mnml-list-card
        title: '[[words.services]]'
        icon: mdi:lan-connect
        rows:
          - id: each-services
            each: services
            as: service
            template: stopped-row
            slots: { entity: '[[service]]' }
      - id: updates
        type: custom:mnml-list-card
        title: '[[words.updates]]'
        icon: mdi:package-up
        rows:
          - id: each-updates
            each: updates
            as: update
            template: pending-row
            slots: { entity: '[[update]]' }
      - id: firmware
        type: custom:mnml-list-card
        title: '[[words.firmware]]'
        icon: mdi:memory
        rows:
          - id: each-firmware
            each: firmware
            as: update
            template: pending-row
            slots: { entity: '[[update]]' }
      - id: each-room_firmware
        each: room_firmware
        as: room
        type: custom:mnml-list-card
        title: '[[room.name]] • [[words.firmware]]'
        icon: mdi:memory
        rows:
          - id: each-room-firmware
            each: room.firmware
            as: update
            template: pending-row
            slots: { entity: '[[update]]' }
  example: *home_assistant

system-messages-popup:
  description: "Home Assistant's messages pop-up: how many there are in its header, with a button that dismisses every notification, which asks first, then the notifications and, for an administrator, the repairs."
  title: Home Assistant messages pop-up
  icon: mdi:bell-outline
  card:
    hash: '#system-messages'
    cards:
      - id: header
        type: custom:mnml-header-card
        name: '[[words.messages]]'
        icon: mdi:bell-outline
        messages: true
        color: amber
        state: [{ id: home-assistant, text: '[[words.home_assistant]]' }]
        controls:
          - id: dismiss
            type: dismiss
            name: '[[words.clear_all]]'
            icon: mdi:notification-clear-all
        back: true
      - id: notifications
        type: custom:mnml-messages-card
        notifications: true
      - id: repairs
        type: custom:mnml-messages-card
        repairs: true
  example: {}
