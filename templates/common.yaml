section-heading:
  description: A section's heading, the full width of the section.
  title: Section heading
  icon: mdi:format-title
  slots:
    title: { kind: text, required: true, help: "The heading's text." }
    icon: { kind: icon, required: true, help: "The heading's icon." }
    state: { kind: objects }
    controls: { kind: objects }
  card:
    type: custom:mnml-heading-card
    title: '[[title]]'
    icon: '[[icon]]'
    state: '[[state]]'
    controls: '[[controls]]'
    grid_options: { columns: full }
  example:
    title: Rooms
    icon: mdi:floor-plan

power:
  description: A filled power toggle for an entity, lit while the entity is on, and armed by a first press while its state matches confirm.
  title: Power button
  icon: mdi:power
  slots:
    entity: { kind: entity, required: true }
    confirm: { kind: object, help: 'The states in which a first press only arms the toggle.' }
    color: { kind: text, default: amber }
    when: { kind: object }
  card:
    type: toggle
    entity: '[[entity]]'
    confirm: '[[confirm]]'
    icon: mdi:power
    color: '[[color]]'
    when: '[[when]]'
    primary: true
  example:
    entity: light.kitchen

nav-chip:
  description: A coloured chip that opens a pop-up.
  title: Pop-up chip
  icon: mdi:open-in-app
  slots:
    entity: { kind: entity, required: true }
    popup: { kind: text, required: true }
    color: { kind: text, required: true }
    when: { kind: object }
  card:
    type: nav
    entity: '[[entity]]'
    popup: '[[popup]]'
    color: '[[color]]'
    when: '[[when]]'
  example:
    entity: climate.living
    popup: '#living-heating'
    color: amber

checks-actions:
  description: The daily checks' Run and Stop controls, Run shown while they are not running and Stop while they are.
  title: Checks run and stop
  icon: mdi:clipboard-play-outline
  slots:
    actions: { shape: checks_actions, required: true }
  card:
    - id: run
      type: service
      entity: '[[actions.run]]'
      service: button.press
      name: '[[words.run_checks]]'
      icon: mdi:play
      show: { entity: '[[actions.running]]', not: ['on'] }
    - id: stop
      type: service
      entity: '[[actions.stop]]'
      service: button.press
      name: '[[words.stop_checks]]'
      icon: mdi:stop
      show: { entity: '[[actions.running]]', is: ['on'] }
  example:
    actions:
      { run: button.checks_run, stop: button.checks_stop, running: binary_sensor.checks_running }

checks-controls:
  description: "The daily checks' Failed and Warnings icons, each drawn while it is not 0, then their Run and Stop controls."
  title: Checks controls
  icon: mdi:clipboard-check-outline
  slots:
    checks: { shape: checks, required: true }
  card:
    - id: failed
      type: status
      name: '[[words.failed]]'
      icon: mdi:alert-circle-outline
      silent: true
      rules: [{ id: failed, entities: ['[[checks.failed]]'], color: red, not: ['0'] }]
    - id: warnings
      if: checks.warnings
      type: status
      name: '[[words.warnings]]'
      icon: mdi:alert-outline
      silent: true
      rules: [{ id: warnings, entities: ['[[checks.warnings]]'], color: orange, not: ['0'] }]
    - id: checks-actions
      if: checks.actions
      template: checks-actions
      slots: { actions: '[[checks.actions]]' }
  example:
    checks:
      failed: sensor.checks_failed
      warnings: sensor.checks_warnings
      last_run: sensor.checks_last_run
      overdue: binary_sensor.checks_overdue

while-not-off:
  description: The visibility that shows a card while its entity is not off.
  title: While not off
  icon: mdi:eye-outline
  slots:
    entity: { kind: entity }
  card:
    - id: entity
      if: entity
      condition: state
      entity: '[[entity]]'
      state_not: 'off'
  example:
    entity: light.kitchen

batteries:
  description: A folding list of batteries, lowest first, orange under 20 % and red under 5 %.
  title: Battery list
  icon: mdi:battery-low
  slots:
    batteries: { kind: entities }
    low: { kind: number, default: 20 }
    critical: { kind: number, default: 5 }
  card:
    - id: batteries
      if: batteries
      type: custom:mnml-list-card
      lowest_first: true
      fold: true
      summary: lowest
      title: '[[words.batteries]]'
      icon: mdi:battery-charging-medium
      rows:
        - id: each-batteries
          each: batteries
          as: battery
          entity: '[[battery]]'
          label: device
          bar: true
          low: '[[low]]'
          critical: '[[critical]]'
  example:
    batteries: [sensor.window_battery, sensor.door_battery]

energy-table:
  description: A folding table of meters, now, today and in total, the heading summing what they used today.
  title: Energy table
  icon: mdi:table
  slots:
    meters: { shape: meter, kind: objects, fields: { power: { required: true } } }
  card:
    type: custom:mnml-list-card
    fold: true
    summary: { sum: 1 }
    title: '[[words.energy]]'
    icon: mdi:lightning-bolt
    headers: ['[[words.item]]', '[[words.now]]', '[[words.today]]', '[[words.total]]']
    rows:
      - id: each-meters
        each: meters
        as: meter
        entity: '[[meter.power]]'
        label: device
        values!: ['[[meter.power]]', '[[meter.today]]', '[[meter.total]]']
  example:
    meters:
      - { power: sensor.plug_power, today: sensor.plug_energy_today, total: sensor.plug_energy }

pending-row:
  description: A list row that flags an update while it is pending.
  title: Pending update row
  icon: mdi:update
  slots:
    entity: { kind: entity, required: true }
  card:
    entity: '[[entity]]'
    label: device
    flag: true
    show: { is: ['on'] }
  example:
    entity: update.router_firmware

stopped-row:
  description: A list row, red, shown while a service or guest is off.
  title: Stopped row
  icon: mdi:stop-circle-outline
  slots:
    entity: { kind: entity, required: true }
  card:
    entity: '[[entity]]'
    label: device
    color: red
    show: { is: ['off'] }
  example:
    entity: binary_sensor.server_status

link-row:
  description: A list row for a link speed, orange while it is not the full speed.
  title: Link speed row
  icon: mdi:speedometer
  slots:
    entity: { kind: entity, required: true }
    speed: { kind: text, default: '10000' }
  card:
    entity: '[[entity]]'
    color: orange
    when: { not: ['[[speed]]'] }
  example:
    entity: sensor.router_wan_link_speed
