unifi-network:
  description: A UniFi network's tile, its latency, and its devices and firmware chips; it brings the network's pop-up and one per Wi-Fi network.
  slots:
    latency:
      {
        kind: entities,
        group: Basics,
        help: "The sensors of the network's latency, the first on the tile.",
        discover: { domain: sensor, platform: unifi, translation_key: wan_latency, scope: all },
      }
    wan: { kind: entity, label: WAN, group: Basics }
    devices:
      {
        kind: entities,
        group: Devices,
        help: "The network's devices, for their state.",
        discover: { domain: sensor, platform: unifi, translation_key: device_state, scope: all },
      }
    wifi: { shape: wifi, kind: objects, label: Wi-Fi networks, group: Wi-Fi }
    clients: { shape: clients, group: Wi-Fi }
    router:
      shape: router
      help: "The router's processor use and temperature."
      group: Basics
      discover:
        fields:
          cpu:
            { domain: sensor, platform: unifi, translation_key: device_cpu_utilization, scope: all }
          temperature:
            { domain: sensor, platform: unifi, translation_key: device_sub_temperature, scope: all }
    firmware:
      {
        kind: entities,
        group: Devices,
        help: "The devices' firmware updates.",
        discover: { domain: update, platform: unifi, scope: all },
      }
    device_up:
      {
        kind: texts,
        default: [connected, upgrading, provisioning],
        label: Up states,
        group: Devices,
      }
  card:
    type: custom:mnml-tile-card
    name: Network
    icon: mdi:router-network
    popup: '#network'
    state: [{ id: latency-0, if: latency, entity: '[[latency.0]]', icon: true }]
    chips:
      - id: devices
        if: devices
        type: status
        name: Devices
        icon: mdi:lan
        silent: true
        rules:
          [
            {
              id: devices,
              if: device_up,
              entities: ['[[devices]]'],
              label: device,
              color: red,
              not: '[[device_up]]',
            },
          ]
      - id: firmware
        if: firmware
        type: status
        name: Firmware
        icon: mdi:memory
        silent: true
        rules:
          [
            {
              id: firmware,
              if: firmware,
              entities: ['[[firmware]]'],
              label: device,
              color: amber,
              is: ['on'],
            },
          ]
    grid_options: { columns: 12 }
  popups:
    - id: network-popup
      template: network-popup
      slots:
        latency: '[[latency]]'
        wan: '[[wan]]'
        devices: '[[devices]]'
        wifi: '[[wifi]]'
        clients: '[[clients]]'
        router: '[[router]]'
        firmware: '[[firmware]]'
        device_up: '[[device_up]]'
    - id: each-wifi
      each: wifi
      as: network
      template: wifi-popup
      slots: { wifi: '[[network]]' }
  example: &network
    latency: [sensor.router_latency]
    devices: [sensor.router_state]
    router: { cpu: sensor.router_cpu, temperature: sensor.router_temperature }
    firmware: [update.router_firmware]

wifi-item:
  description: A Wi-Fi network as an item, its switch when it may be switched from the dashboard, opening its pop-up.
  slots:
    wifi: { shape: wifi, required: true }
  card:
    type: custom:mnml-entity-card
    entity: '[[wifi.enabled]]'
    label: device
    popup: '#network-[[wifi.key]]'
    controls?:
      - id: wifi-switchable
        if: wifi.switchable
        template: power
        slots: { entity: '[[wifi.enabled]]' }
  example:
    wifi: { key: guests, enabled: switch.guests_wifi, switchable: true }

network-popup:
  description: The network's pop-up, its internet, devices, router, Wi-Fi networks, clients and firmware.
  slots:
    latency: { kind: entities }
    wan: { kind: entity }
    devices: { kind: entities }
    wifi: { shape: wifi, kind: objects }
    clients: { shape: clients }
    router: { shape: router }
    firmware: { kind: entities }
    device_up: { kind: texts, default: [connected, upgrading, provisioning] }
  card:
    hash: '#network'
    cards:
      - id: header
        type: custom:mnml-header-card
        name: Network
        icon: mdi:router-network
        state: [{ id: latency-0, if: latency, entity: '[[latency.0]]', icon: true }]
      - id: internet
        type: custom:mnml-list-card
        title: Internet
        icon: mdi:web
        rows:
          - id: each-latency
            each: latency
            as: probe
            entity: '[[probe]]'
          - id: wan
            if: wan
            template: link-row
            slots: { entity: '[[wan]]' }
      - id: devices
        type: custom:mnml-list-card
        title: Devices
        icon: mdi:lan
        rows:
          - id: each-devices
            each: devices
            as: device
            if: device_up
            entity: '[[device]]'
            label: device
            color: red
            when: { not: '[[device_up]]' }
          - id: each-devices-2
            each: devices
            as: device
            unless: device_up
            entity: '[[device]]'
            label: device
      - id: router
        if: router
        type: custom:mnml-list-card
        title: Router
        icon: mdi:router
        rows:
          - id: router-cpu
            if: router.cpu
            entity: '[[router.cpu]]'
            bar: true
          - id: router-temperature
            if: router.temperature
            entity: '[[router.temperature]]'
      - id: wifi
        if: wifi
        type: custom:mnml-heading-card
        title: Wi-Fi
        icon: mdi:wifi
      - id: each-wifi
        each: wifi
        as: network
        template: wifi-item
        slots: { wifi: '[[network]]' }
      - id: clients
        if: clients
        type: custom:mnml-clients-card
        entity: '[[clients.entity]]'
        names: '[[clients.names]]'
        networks: '[[clients.networks]]'
        fold: true
      - id: firmware
        type: custom:mnml-list-card
        title: Firmware
        icon: mdi:memory
        rows:
          - id: each-firmware
            each: firmware
            as: update
            template: pending-row
            slots: { entity: '[[update]]' }
  example: *network

wifi-popup:
  description: A Wi-Fi network's pop-up, its switch and the QR code to join it while it is on.
  slots:
    wifi: { shape: wifi, required: true }
  card:
    hash: '#network-[[wifi.key]]'
    cards:
      - id: header
        type: custom:mnml-header-card
        entity: '[[wifi.enabled]]'
        label: device
        state: [{ id: network, text: Network }, { id: part-2, when: { is: ['off'] } }]
        controls?:
          - id: wifi-switchable
            if: wifi.switchable
            template: power
            slots: { entity: '[[wifi.enabled]]' }
        back: true
      - id: heading
        if: wifi.qr
        type: custom:mnml-heading-card
        title: Scan to join
        icon: mdi:qrcode-scan
        visibility: { template: while-not-off, slots: { entity: '[[wifi.enabled]]' } }
      - id: picture-entity
        if: wifi.qr
        type: picture-entity
        entity: '[[wifi.qr]]'
        show_name: false
        show_state: false
        visibility: { template: while-not-off, slots: { entity: '[[wifi.enabled]]' } }
  example:
    wifi: { key: guests, enabled: switch.guests_wifi, qr: image.guests_wifi_qr, switchable: true }
